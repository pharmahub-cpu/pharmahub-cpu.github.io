/* Small static trigger spray-bottle icon shown beside the press-and-hold
   spray button (idle state, before/after spraying). */
function sprayIconHTML(){
  return `<img class="spray-bottle-photo" src="${SPRAY_BOTTLE_HAND_IMG}" alt="Gloved hand holding the ninhydrin spray bottle" width="140" height="248">`;
}
/* Simple line-drawn forceps/tweezers, gripping the chromatogram's edge
   while it is held up vertically for ninhydrin spraying. */
function forcepsHTML(){
  return `<img class="forceps-svg" src="${FORCEPS_HAND_IMG}" alt="Gloved hand holding forceps gripping the chromatogram's edge" width="150" height="116">`;
}
/* A continuous stream of small fine-mist droplets, positioned along the
   gap between the spray bottle and the chromatogram; each one loops the
   mistFly keyframe (paused until the .active class is toggled on the
   track by startSpraying()/stopSpraying(), so the loop runs only while
   the spray button is actually held down). */
function mistDropsHTML(){
  let out='';
  for(let i=0;i<12;i++){
    const delay = (i*0.09).toFixed(2);
    const jit = (Math.sin(i*1.7)*16).toFixed(1);
    const top = (50+Math.cos(i*2.1)*34).toFixed(1);
    out += `<span class="mist-drop" style="top:${top}%;animation-delay:${delay}s;--jit:${jit}px;"></span>`;
  }
  return out;
}
/* A realistic laboratory hot-air oven: grey metallic cabinet, a top
   control panel (temperature + timer knobs, mains/heating indicator
   lights), and a stainless-steel interior with a perforated tray —
   drawn at 1 SVG-unit-per-CSS-pixel (width/height match the viewBox
   exactly) so the separate HTML door overlay can be positioned over
   the cavity with simple, exact pixel coordinates. The door itself is
   NOT part of this SVG — see OVEN_DOOR_RECT and hotOvenDoorHTML(). */
const OVEN_DOOR_RECT = {left:16, top:44, width:208, height:160};
function hotOvenSVG(heatingActive){
  const holes = [];
  for(let i=0;i<13;i++){ holes.push(`<circle cx="${40+i*13.4}" cy="187" r="2" fill="#5a6469"></circle>`); }
  for(let i=0;i<13;i++){ holes.push(`<circle cx="${40+i*13.4}" cy="196" r="2" fill="#5a6469"></circle>`); }
  return `<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ovenBodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#dfe5e8"></stop>
        <stop offset="100%" stop-color="#b7c0c4"></stop>
      </linearGradient>
      <linearGradient id="ovenCavityGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8f9aa0"></stop>
        <stop offset="100%" stop-color="#5c666b"></stop>
      </linearGradient>
    </defs>
    <rect x="8" y="38" width="224" height="176" rx="9" fill="url(#ovenBodyGrad)" stroke="#8b9498" stroke-width="2"></rect>
    <rect x="8" y="6" width="224" height="34" rx="7" fill="#eef1f2" stroke="#b7c0c4" stroke-width="2"></rect>
    <text x="120" y="17" text-anchor="middle" font-size="12.5" font-weight="700" font-family="Arial,sans-serif" fill="#123a63">HOT AIR OVEN</text>
    <circle cx="34" cy="22" r="12" fill="#2a2a2a" stroke="#111" stroke-width="1"></circle>
    <line x1="34" y1="22" x2="34" y2="13" stroke="#e7e7e7" stroke-width="1.6" stroke-linecap="round" transform="rotate(35 34 22)"></line>
    <circle cx="206" cy="22" r="12" fill="#2a2a2a" stroke="#111" stroke-width="1"></circle>
    <line x1="206" y1="22" x2="206" y2="13" stroke="#e7e7e7" stroke-width="1.6" stroke-linecap="round" transform="rotate(-20 206 22)"></line>
    <circle cx="112" cy="32" r="5" fill="${heatingActive?'#e33a2e':'#7a2b25'}" ${heatingActive?'class="hotoven-heat-glow"':''}></circle>
    <circle cx="130" cy="32" r="5" fill="#2fae5a"></circle>
    <!-- interior, always drawn; hidden behind the closed door overlay -->
    <rect x="${OVEN_DOOR_RECT.left+10}" y="${OVEN_DOOR_RECT.top+34}" width="${OVEN_DOOR_RECT.width-20}" height="${OVEN_DOOR_RECT.height-42}" rx="5" fill="url(#ovenCavityGrad)" stroke="#454d51" stroke-width="2"></rect>
    <line x1="34" y1="98" x2="50" y2="98" stroke="#454d51" stroke-width="2"></line>
    <line x1="34" y1="140" x2="50" y2="140" stroke="#454d51" stroke-width="2"></line>
    <line x1="190" y1="98" x2="206" y2="98" stroke="#454d51" stroke-width="2"></line>
    <line x1="190" y1="140" x2="206" y2="140" stroke="#454d51" stroke-width="2"></line>
    <rect x="34" y="182" width="172" height="18" rx="2" fill="#7c878d" stroke="#454d51" stroke-width="1.4"></rect>
    ${holes.join('')}
  </svg>`;
}
/* Blue front door, drawn as a plain HTML overlay (not SVG) precisely
   sized to OVEN_DOOR_RECT, so a CSS 3D rotateY can swing it open/closed
   reliably — SVG child transforms with perspective are unreliable across
   browsers, plain block elements are not. animCls plays the one-shot
   opening/closing keyframe; when absent the door sits in its resting
   (open or closed) pose per isOpen. */
function hotOvenDoorHTML(isOpen, animCls){
  const r = OVEN_DOOR_RECT;
  const cls = 'hotoven-door'+(animCls?(' '+animCls):(isOpen?' is-open':''));
  return `<div class="${cls}" style="left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;">
      <div class="hotoven-door-vent"></div>
      <div class="hotoven-door-handle"></div>
    </div>`;
}
/* The chromatogram, shown flat and small, centred over the oven's tray —
   reuses the exact same paper renderer as the rest of the app so it's
   always the same paper, just viewed at a smaller size inside the oven. */
function hotOvenTrayPaperHTML(spotOpacity, extraCls){
  const svg = renderPaperSVG({
    showOriginCircle:true, showSectors:true, showOriginDots:true,
    showMigration:true, frontRadiusPx: currentFrontRadiusPx(), frontDashed:false,
    spotOpacity
  });
  const r = OVEN_DOOR_RECT;
  const size = 128;
  const left = r.left + r.width/2 - size/2;
  const top = r.top + 30;
  return `<div class="hotoven-tray-paper${extraCls?(' '+extraCls):''}" style="left:${left}px;top:${top}px;width:${size}px;height:${size}px;">${svg}</div>`;
}
function currentFrontRadiusPx(){ return CFG.paperRadiusPx*(RND.solventFrontDistanceCm/CFG.paperRadiusCm); }
function ovenReadoutHTML(statusText){
  return `<div class="hotoven-readout">
    <div class="line1">Temperature: ${CFG.ovenTemperatureC} °C</div>
    <div class="line1">Time: ${CFG.ovenTimeMinutes} min</div>
    <div class="line2">${statusText}</div>
  </div>`;
}

function afterDetectionRender(){
  if(OBS.ninhydrinSprayed || OBS.sprayCoverage>=100) return;
  const btn = document.getElementById('sprayHoldBtn');
  if(!btn) return;
  const onDown = function(e){
    e.preventDefault();
    try{ btn.setPointerCapture(e.pointerId); }catch(err){}
    startSpraying();
  };
  const onUp = function(e){
    try{ btn.releasePointerCapture(e.pointerId); }catch(err){}
    stopSpraying(false);
  };
  btn.addEventListener('pointerdown', onDown);
  btn.addEventListener('pointerup', onUp);
  btn.addEventListener('pointercancel', onUp);
  btn.addEventListener('pointerleave', onUp);
}
/* Press-and-hold ninhydrin spraying: while the button is held, a fine
   continuous mist animates across to the chromatogram and OBS.sprayCoverage
   climbs from wherever it left off (release just pauses it — nothing is
   lost) up to 100 over CFG.sprayFullDurationMs of real holding time. To
   keep the held pointer/button element stable across the whole gesture
   (so pointer capture and the listeners above are never disturbed
   mid-hold), the coverage bar, mist and wet-overlay are updated by
   directly touching the DOM here rather than by calling the app's normal
   full render() on every tick; render() is only called at the two clean
   boundaries — reaching 100% coverage, and the explicit Continue click. */
let _sprayInterval = null;
function startSpraying(){
  if(OBS.ninhydrinSprayed || OBS.sprayCoverage>=100 || OBS.spraying) return;
  OBS.spraying = true;
  const track = document.getElementById('sprayMistTrack');
  if(track) track.classList.add('active');
  const btn = document.getElementById('sprayHoldBtn');
  if(btn) btn.classList.add('is-active');
  const label = document.getElementById('sprayCoverageLabel');
  if(label) label.textContent = 'Spraying…';
  const startTime = performance.now();
  const startCoverage = OBS.sprayCoverage;
  if(_sprayInterval) clearInterval(_sprayInterval);
  _sprayInterval = setInterval(()=>{
    const elapsed = performance.now()-startTime;
    OBS.sprayCoverage = Math.min(100, startCoverage + (elapsed/CFG.sprayFullDurationMs)*100);
    const fill = document.getElementById('sprayCoverageFill');
    if(fill) fill.style.width = OBS.sprayCoverage+'%';
    const pct = document.getElementById('sprayCoveragePct');
    if(pct) pct.textContent = Math.round(OBS.sprayCoverage)+'%';
    const overlay = document.getElementById('paperWetOverlay');
    if(overlay) overlay.style.opacity = (OBS.sprayCoverage/100*0.9).toFixed(2);
    if(OBS.sprayCoverage>=100){ stopSpraying(true); }
  }, 80);
}
function stopSpraying(reachedFull){
  if(_sprayInterval){ clearInterval(_sprayInterval); _sprayInterval=null; }
  OBS.spraying = false;
  const track = document.getElementById('sprayMistTrack');
  if(track) track.classList.remove('active');
  const btn = document.getElementById('sprayHoldBtn');
  if(btn) btn.classList.remove('is-active');
  if(reachedFull){
    showToast('Chromatogram adequately sprayed with ninhydrin.','good');
    render();
  } else {
    const label = document.getElementById('sprayCoverageLabel');
    if(label) label.textContent = OBS.sprayCoverage>0 ? 'Paused' : 'Ready';
  }
}
function finishSpraying(){
  if(OBS.sprayCoverage<100 || OBS.ninhydrinSprayed) return;
  OBS.ninhydrinSprayed = true;
  OBS.ovenPhase = 'waiting';
  render();
}
/* The interactive hot-air-oven sequence: door opens → paper transferred
   onto the tray → door closes → heating (accelerated) → door reopens →
   paper removed, now coloured → an explicit Continue button (no
   automatic stage-advance, and no repeated "Next" clicks in between). */
function placeInOven(){
  if(OBS.ovenPhase!=='waiting') return;
  OBS.ovenPhase = 'opening';
  render();
  setT(()=>{
    OBS.ovenPhase = 'transferring';
    render();
    setT(()=>{
      OBS.ovenPhase = 'closing';
      render();
      setT(()=>{
        OBS.ovenPhase = 'heating';
        startHeating();
      }, CFG.ovenDoorAnimMs);
    }, CFG.ovenTransferMs);
  }, CFG.ovenDoorAnimMs);
}
function startHeating(){
  OBS.heating=true; OBS.heatingProgress=0; render();
  const t0=Date.now();
  const timer=setI(()=>{
    const pct=clamp(((Date.now()-t0)/CFG.heatingDurationMs)*100,0,100);
    OBS.heatingProgress=pct;
    render();
    if(pct>=100){
      clearInterval(timer);
      OBS.heating=false;
      OBS.ovenPhase='reopening';
      render();
      setT(()=>{
        OBS.ovenPhase='removing';
        render();
        setT(()=>{
          OBS.ovenPhase='done';
          OBS.colourDeveloped=true;
          showToast('Colour development complete.','good');
          render();
        }, CFG.ovenTransferMs);
      }, CFG.ovenDoorAnimMs);
    }
  },90);
}

function renderSpotDetailPanel(){
  if(!OBS.selectedPointId){
    return `<div class="info-note">No point selected yet — click a coloured dot on the chromatogram above.</div>`;
  }
  const dev = developableDistanceCm();
  let title, std;
  if(OBS.selectedPointId.indexOf('std_')===0){
    const key = OBS.selectedPointId.slice(4);
    std = OBS.standards.find(s=>s.key===key);
    title = std.name+' (Standard)';
  } else {
    const slot = OBS.selectedPointId.slice(8);
    const key = OBS.mixtureComponents[slot];
    std = OBS.standards.find(s=>s.key===key);

  }
  const isMixtureSpot = OBS.selectedPointId.indexOf('mixture_')===0;
  const spotRf = isMixtureSpot ? mixtureSpotRf(OBS.selectedPointId.slice(8)) : std.actualRf;
  const travel = spotRf*dev;
  return `<div class="calc-step">
    <h4>${title} ${whyBtn('rf')}</h4>

    <table class="obs-table">
      <tr><td>Distance travelled by solute</td><td class="val">${fmt(travel,2)} cm</td></tr>
      <tr><td>Distance travelled by solvent front</td><td class="val">${fmt(dev,2)} cm</td></tr>

/* Rf calculation practice, using this run's own real measurements rather
   than a generic textbook example: the student is given the distance
   travelled by the solvent front and by each unknown mixture spot, and
   must calculate the Rf of each unknown themselves — no hint is offered.
   Once both are correct, their Rf values are added as rows to the
   standards table below, and the identification step unlocks. */
function rfPracticeBothCorrect(){
  return OBS.rfPractice.inner.correct===true && OBS.rfPractice.outer.correct===true;
}
function renderRfPracticePanel(){
  const dev = developableDistanceCm();

        ? `<div style="color:var(--good);font-weight:700;font-size:12.2px;margin-top:4px;">✓ Correct.</div>`

    }

      </td>

          <button class="btn btn-primary btn-sm" onclick="App.checkRfPractice('${slot}')">Check</button>
        </div>

  }).join('');
  return `<div class="calc-step">
    <h4>📐 Calculate the Rf of the Unknown Spots</h4>
    <p style="font-size:12.6px;color:var(--muted);margin:0 0 8px;">Using the distances measured from this chromatogram, work out the Rf value of each unknown spot in the mixture.</p>
    <table class="obs-table">
      <tr><th>Spot</th><th>Distance travelled by spot</th><th>Distance travelled by solvent</th><th>Your Rf</th></tr>
      ${rows}
    </table>
    <div class="rf-mini-calc" style="margin-top:10px;padding:10px 12px;background:#f4f8f9;border:1px solid #dbe6e9;border-radius:8px;">
      <div style="font-weight:700;font-size:12.4px;color:var(--ink,#25414a);margin-bottom:6px;">🧮 Quick calculator — click the 🧮 next to a spot to load its numbers, or type your own</div>
      <div class="field-row" style="margin:0;gap:8px;flex-wrap:wrap;align-items:center;">

        <span style="font-weight:700;">÷</span>
        <input type="text" id="rfCalcB" placeholder="distance by solvent" style="width:130px;" oninput="App.computeRfCalc()">
        <span style="font-weight:700;">=</span>
        <span id="rfCalcResult" style="font-weight:700;min-width:60px;color:var(--accent,#6d3fa0);">—</span>

}
function fillRfCalc(travel,dev){
  const a=document.getElementById('rfCalcA'), b=document.getElementById('rfCalcB');
  if(!a||!b) return;
  a.value = (Math.round(travel*100)/100).toString();
  b.value = (Math.round(dev*100)/100).toString();
  computeRfCalc();
  a.focus();
}
function computeRfCalc(){
  const a = parseFloat((document.getElementById('rfCalcA')||{}).value);
  const b = parseFloat((document.getElementById('rfCalcB')||{}).value);
  const out = document.getElementById('rfCalcResult');
  if(!out) return;
  if(isNaN(a) || isNaN(b) || b===0){ out.textContent = '—'; return; }
  out.textContent = fmt(a/b, 3);
}
function checkRfPractice(slot){
  const el=document.getElementById('rfPracticeInput_'+slot);
  if(!el) return;
  const val=parseFloat(el.value);
  const p = OBS.rfPractice[slot];
  p.input = el.value;
  p.checked = true;
  p.correct = !isNaN(val) && Math.abs(val-mixtureSpotRf(slot))<=0.02;
  showToast(p.correct
    ? ('Unknown Spot '+(slot==='inner'?'1':'2')+' — Rf calculated correctly.')
    : 'That Rf doesn\'t match — recheck your calculation.', p.correct?'good':'bad');
  render();
}

function renderIdentificationPanel(){
  const dev = developableDistanceCm();
  const stdRows = OBS.standards.map(std=>{
    const travel = std.actualRf*dev;
    return `<tr><td>${std.name}</td><td>${fmt(travel,2)} cm</td><td>${fmt(std.actualRf,3)}</td></tr>`;
  }).join('');
  const unlocked = rfPracticeBothCorrect();
  const sampleRows = unlocked ? ['inner','outer'].map((slot,i)=>{
    const travel = mixtureSpotRf(slot)*dev;
    return `<tr><td>Unknown Spot ${i+1} (sample)</td><td>${fmt(travel,2)} cm</td><td>${fmt(parseFloat(OBS.rfPractice[slot].input),3)}</td></tr>`;
  }).join('') : '';

  let idSection;
  if(!unlocked){
    idSection = `<div class="info-note" style="margin-top:12px;">Calculate the Rf of <b>both</b> unknown spots correctly above to unlock identification.</div>`;
  } else {
    const idRows = ['inner','outer'].map((slot,i)=>{
      const trueKey = OBS.mixtureComponents[slot];
      const std = OBS.standards.find(s=>s.key===trueKey);
      const chosen = OBS.identification[slot];
      const result = OBS.identificationResult[slot];
      const opts = OBS.standards.map(s=>`<option value="${s.key}" ${chosen===s.key?'selected':''}>${s.name}</option>`).join('');
      let fb='';
      if(result===true) fb='<span style="color:var(--good);font-weight:700;">✓ Correct identification.</span>';
      else if(result===false) fb='<span style="color:var(--bad);font-weight:700;">✗ Incorrect. Compare the Rf value with the standards table above.</span>';
      return `<div class="field-row" style="align-items:center;">
        <span style="min-width:230px;font-size:12.8px;font-weight:600;">Unknown Spot ${i+1} (${slot==='inner'?'closer to origin':'farther out'})</span>
        <select id="idSelect_${slot}" onchange="App.stageIdentification('${slot}',this.value)">
          <option value="">— Identify —</option>
          ${opts}
        </select>
        <button class="btn btn-secondary btn-sm" onclick="App.confirmIdentification('${slot}')">Confirm</button>
        <span>${fb}</span>
      </div>`;
    }).join('');
    idSection = `<h4 style="margin-top:12px;">Identify Unknown Spot 1 and Unknown Spot 2</h4>${idRows}`;
  }

  return `<div class="calc-step">
    <h4>🧬 Standards Run on This Paper</h4>
    <table class="ref-table"><tr><th>Standard</th><th>Distance travelled</th><th>Rf</th></tr>${stdRows}${sampleRows}</table>
    ${idSection}
  </div>`;
}
function selectStandardDot(key){ OBS.selectedPointId='std_'+key; render(); }
function selectMixtureDot(slot){ OBS.selectedPointId='mixture_'+slot; render(); }
function stageIdentification(slot,val){ OBS.identification[slot]=val||null; }
function confirmIdentification(slot){
  const chosenKey = OBS.identification[slot];
  if(!chosenKey){ showToast('Select an amino acid from the list first.','warn'); return; }
  const trueKey = OBS.mixtureComponents[slot];
  const correct = chosenKey===trueKey;
  OBS.identificationResult[slot]=correct;
  showToast(correct?'Correct identification.':'Incorrect identification — check the Rf value again.', correct?'good':'bad');
  const allDone = ['inner','outer'].every(s=>OBS.identificationResult[s]===true);
  if(allDone){ OBS.allIdentified=true; OBS.recorded=true; }
  render();
}

  const dev = developableDistanceCm();

  OBS.standards.forEach(std=>{

    const idName = idKey ? (OBS.standards.find(s=>s.key===idKey)||{}).name : '—';

    rows.push({ label: 'Mixture — '+(slot==='inner'?'closer spot':'farther spot'), travel: spotRf*dev, front: dev, rf: spotRf, id: idName });

    `<tr><td>${idx+1}. ${r.label}</td><td>${fmt(r.travel,2)} cm</td><td>${fmt(r.front,2)} cm</td><td>${fmt(r.rf,3)}</td><td>${r.id}</td></tr>`
  ).join('');
  return stageHeader('🏁','Step 5 · Result &amp; Report','The amino acids present in the given sample were separated successfully by circular paper chromatography.') + `
  <div class="good-note" style="font-size:14.5px;font-weight:700;text-align:center;padding:14px;">✓ The amino acids present in the mixture were separated and identified successfully by circular paper chromatography.</div>
  <div class="bench"><div class="paper-wrap">${svg}</div></div>
  <h4>Observation Table</h4>
  <table class="report-table">
    <tr><th>Spot</th><th>Distance travelled</th><th>Solvent front</th><th>Rf</th><th>Identification</th></tr>
    ${rows}
  </table>
  <div id="quizArea" style="margin-top:22px;">${renderQuizHTML()}</div>`;
}
function buildReportHTML(){
  const rows = buildObservationRows().map((r,idx)=>
    `<tr><td style="padding:5px;border:1px solid #ccc;">${idx+1}. ${r.label}</td><td style="padding:5px;border:1px solid #ccc;">${fmt(r.travel,2)} cm</td><td style="padding:5px;border:1px solid #ccc;">${fmt(r.front,2)} cm</td><td style="padding:5px;border:1px solid #ccc;">${fmt(r.rf,3)}</td><td style="padding:5px;border:1px solid #ccc;">${r.id}</td></tr>`
  ).join('');
  /* The same developed-chromatogram SVG shown on the Result stage, embedded
     here as vector markup (not a raster screenshot) so it stays crisp both
     when printed and inside the standalone downloaded report file — which
     has no access to the app's own stylesheet, hence the small scoped
     <style> block that sizes it. */
  const chromatogramSvg = renderPaperSVG({
    showOriginCircle:true, showSectors:true, showOriginDots:true,
    showMigration:true, frontRadiusPx: currentFrontRadiusPx(), frontLabel:true, frontDashed:false,
    spotOpacity:1, showGuideRings:true, guideStandards:OBS.standards
  });
  return `
  <style>.report-chromatogram-wrap svg.paper-svg{width:100%;height:100%;display:block;overflow:visible;}
  #printReportArea p{text-align:justify;}</style>
  <h2 style="margin-bottom:2px;">Separation of Amino Acids by Circular Paper Chromatography</h2>
  <p style="color:#555;margin-top:0;">Date: ${OBS.expDate} &nbsp;|&nbsp; Student: ${OBS.studentName||'—'} &nbsp;|&nbsp; Institute: ${OBS.instituteName||'—'}${OBS.rollClass?(' &nbsp;|&nbsp; '+OBS.rollClass):''}</p>
  <h3>Objective</h3>
  <p>To separate and identify amino acids present in a mixture using circular paper chromatography.</p>
  <h3>Principle</h3>
  <p>Amino acids separate because of their differing affinities for the stationary phase (chromatographic paper) and mobile phase (developing solvent). A small origin circle (~2.6 cm diameter) with a hanging wick at its centre was used; ${OBS.numStandards} known standards and a mixture of two of them were spotted at equally spaced points around this circle. The wick drew solvent up into the centre, from where it moved radially outward, and each spot migrated at its own characteristic rate.</p>
  <h3>Materials</h3>
  <p>Circular Whatman filter paper (readymade, with origin circle and hanging wick), pencil, capillary tube/micropipette, standard amino-acid solutions, unknown amino-acid mixture, developing solvent, developing chamber (Petri dish/beaker), ninhydrin reagent, hot-air oven.</p>
  <h3>Procedure Summary</h3>
  <p>A readymade circular filter paper, with its origin circle (~2.6 cm diameter) and hanging wick already marked at the centre, was used. ${OBS.numStandards} standard amino acids and a mixture of two of them were each spotted in pencil at equally spaced points around this circle and dried. The paper was placed in a saturated developing chamber with the wick dipping into the solvent, which was drawn up and moved radially outward, separating the components. After development, the solvent front was marked, the paper dried, sprayed with ninhydrin, and heated to develop colour. The mixture's two components were identified by comparing their Rf values with the standards run on the same paper.</p>
  <h3>Developed Chromatogram</h3>
  <div style="text-align:center;margin:8px 0 16px;">
    <div class="report-chromatogram-wrap" style="width:300px;height:300px;margin:0 auto;">${chromatogramSvg}</div>
    <p style="font-size:11.5px;color:#666;margin-top:6px;">Fig. Developed circular paper chromatogram after ninhydrin spray and heating, showing the standard and mixture spots with their migration from the origin circle.</p>
  </div>
  <h3>Observations</h3>
  <table style="width:100%;border-collapse:collapse;font-size:13px;">
    <tr><th style="padding:5px;border:1px solid #ccc;">Spot</th><th style="padding:5px;border:1px solid #ccc;">Distance travelled</th><th style="padding:5px;border:1px solid #ccc;">Solvent front</th><th style="padding:5px;border:1px solid #ccc;">Rf</th><th style="padding:5px;border:1px solid #ccc;">Identification</th></tr>
    ${rows}
  </table>
  <h3 style="margin-top:12px;">Result</h3>
  <p>The amino acids present in the mixture were separated and identified successfully by circular paper chromatography.</p>
  <h3>Precautions</h3>
  <ul>
    <li>Use pencil for marking application points around the origin circle.</li>
    <li>Apply a small, concentrated sample spot (0.8–1 mm) at each marked point.</li>
    <li>Avoid excessive sample application.</li>
    <li>Keep the chromatography chamber properly closed.</li>
    <li>Mark the solvent front immediately after development.</li>
    <li>Handle ninhydrin reagent according to laboratory safety procedures.</li>
    <li>Avoid direct contact with reagents.</li>
  </ul>
  ${buildQuizReportHTML()}`;
}
/* Included in the printed/downloaded report only once the student has
   submitted the quiz at least once, so the report and the on-screen quiz
   panel never disagree about whether a score exists yet. */
function buildQuizReportHTML(){
  if(!UI.__quizSubmittedForReport) return '';
  const itemsHtml = QUIZ.map((item,qi)=>{
    const ans = OBS.quizAnswers[qi];

    return `<div style="margin-bottom:10px;padding:8px 10px;border:1px solid #ccc;border-radius:6px;">

    </div>`;
  }).join('');
  return `<h3 style="margin-top:16px;">Quick Assessment (Quiz)</h3>

}

/* ---- QUIZ ----
   A 40-question practical-MCQ bank (paper chromatography procedure,
   technique, troubleshooting, visualization and Rf calculation). Each
   attempt draws a fresh random 10 of the 40 (see pickQuizSet()), called
   once per experiment run and again on every Retry Quiz, so the quiz
   itself is different each time rather than a fixed fake "random". */
const QUIZ_BANK = [
  {q:'Before developing a paper chromatogram, the developing chamber is preferably saturated with:', opts:['Solvent vapour','Air vapour','Water vapour','Sample vapour'], correct:0},
  {q:'The baseline for spotting samples on chromatography paper is usually drawn using:', opts:['Ink pen','Pencil','Marker pen','Ball pen'], correct:1},
  {q:'The sample spots should be placed:', opts:['Below the solvent level','At the solvent surface','Above the solvent level','At the paper edge'], correct:2},
  {q:'The main purpose of keeping the sample spot above the solvent level is to:', opts:['Increase solvent volume','Increase paper thickness','Reduce chamber size','Prevent direct dissolution'], correct:3},
  {q:'A very large sample spot may result in:', opts:['Spot spreading','Faster drying','Lower solvent level','Shorter paper length'], correct:0},
  {q:'Multiple applications of a sample at the same position should generally be followed by:', opts:['Solvent addition','Spot drying','Paper washing','Chamber heating'], correct:1},
  {q:'In ascending paper chromatography, the mobile phase moves:', opts:['Downward','Sideways','Upward','Backward'], correct:2},
  {q:'The movement of solvent through chromatography paper primarily occurs by:', opts:['Diffusion','Sedimentation','Filtration','Capillary action'], correct:3},
  {q:'Immediately after removing the chromatogram, the solvent front should be:', opts:['Marked','Washed','Heated','Covered'], correct:0},
  {q:'The distance travelled by a solute is measured from the:', opts:['Paper edge','Solvent front','Chamber base','Origin line'], correct:3},
  {q:'The Rf value is obtained by dividing:', opts:['Solvent distance by spot distance','Spot distance by solvent distance','Spot distance by paper length','Paper length by solvent distance'], correct:1},
  {q:'A compound travels 4 cm and the solvent front travels 8 cm. Its Rf value is:', opts:['0.25','0.50','2.00','4.00'], correct:1},
  {q:'The theoretical range of an Rf value is generally:', opts:['0 to 1','1 to 5','5 to 10','10 to 100'], correct:0},
  {q:'A spot travelling almost with the solvent front will have an Rf value:', opts:['Close to zero','Around 0.25','Around 0.50','Close to one'], correct:3},
  {q:'If a compound travels 3 cm and the solvent front travels 6 cm, its Rf value is:', opts:['0.25','0.50','1.50','2.00'], correct:1},
  {q:'The paper used commonly as the support in paper chromatography is made mainly of:', opts:['Cellulose','Silica','Alumina','Glass'], correct:0},
  {q:'A sample spot is placed below the solvent level. What is most likely to occur?', opts:['Better separation','Higher Rf value','Direct dissolution','Faster visualization'], correct:2},
  {q:'Why is pencil preferred for marking the baseline?', opts:['It increases Rf','It improves resolution','It absorbs solvent','It does not migrate'], correct:3},
  {q:'The developing chamber should preferably remain:', opts:['Open','Covered','Heated','Empty'], correct:1},
  {q:'The primary purpose of chamber saturation is to:', opts:['Reduce paper thickness','Increase sample size','Limit solvent evaporation','Increase spot diameter'], correct:2},
  {q:'A compact sample spot is preferred because it generally provides:', opts:['Better separation','Higher temperature','Lower solvent volume','Faster paper drying'], correct:0},
  {q:'If the sample spot becomes a long streak, the most likely cause is:', opts:['Short development','Excess sample','Low temperature','Small chamber'], correct:1},
  {q:'If two components have nearly identical Rf values, their separation is:', opts:['Complete','Excellent','Poor','Quantitative'], correct:2},
  {q:'To improve separation between closely migrating components, the analyst may change the:', opts:['Paper colour','Pencil type','Chamber shape','Solvent composition'], correct:3},
  {q:'In a properly developed chromatogram, the solvent front should be:', opts:['Clearly identifiable','Completely invisible','Below the origin','Inside the reservoir'], correct:0},
  {q:'The solvent front is marked immediately because the solvent:', opts:['Changes colour','Evaporates','Solidifies','Reacts with paper'], correct:1},
  {q:'Ninhydrin is commonly used for visualization of:', opts:['Amino acids','Lipids','Steroids','Alkaloids'], correct:0},
  {q:'Colourless chromatographic spots may be detected using:', opts:['Distilled water','UV light','Sodium chloride','Mineral oil'], correct:1},
  {q:'If the chromatogram is tilted during development, it may cause:', opts:['Uneven solvent movement','Higher paper strength','Lower solvent volume','Faster spot drying'], correct:0},
  {q:'The distance travelled by a spot is measured to the:', opts:['Lower edge of spot','Upper edge of spot','Centre of spot','Origin of paper'], correct:2},
  {q:'A compound has travelled 7.5 cm while the solvent front travelled 10 cm. Its Rf value is:', opts:['0.25','0.50','0.75','1.50'], correct:2},
  {q:'If a compound has an Rf value of zero, the compound has:', opts:['Reached the solvent front','Remained at the origin','Moved beyond the paper','Migrated with the solvent'], correct:1},
  {q:'If an Rf value is very close to 1, the compound has:', opts:['Remained at origin','Migrated very little','Moved nearly with solvent front','Remained completely insoluble'], correct:2},
  {q:'For reliable comparison of Rf values, chromatograms should be developed under:', opts:['Different conditions','Random conditions','Variable conditions','Similar conditions'], correct:3},
  {q:'A spot should preferably be applied as:', opts:['A small compact spot','A large circular spot','A broad horizontal band','A continuous streak'], correct:0},
  {q:'If the solvent front reaches the extreme top of the paper, accurate Rf determination may become:', opts:['Easier','Less reliable','More sensitive','More selective'], correct:1},

  {q:'The chromatographic paper should preferably be handled carefully to avoid:', opts:['Increasing solvent polarity','Contaminating the paper','Increasing Rf value','Reducing chamber volume'], correct:1},
  {q:'If no visible spot appears after development, the next appropriate step is to:', opts:['Discard the paper','Repeat without solvent','Use a suitable visualization method','Increase paper thickness'], correct:2},
  {q:'Which sequence represents the correct practical order?', opts:['Spot → Saturate → Develop → Mark front','Develop → Spot → Saturate → Calculate Rf','Saturate → Develop → Spot → Mark front','Saturate → Spot → Develop → Mark front'], correct:3}
];
let QUIZ = [];
function pickQuizSet(){ QUIZ = shuffleArr(QUIZ_BANK).slice(0,10); }
function renderQuizHTML(){
  let h='<h3>📝 Quick Assessment</h3>';
  QUIZ.forEach((item,qi)=>{
    const ans=OBS.quizAnswers[qi];
    h+=`<div class="quiz-q"><h5>${qi+1}. ${item.q}</h5>`;
    item.opts.forEach((opt,oi)=>{
      let cls='quiz-opt';
      if(OBS.quizSubmitted){
        if(oi===item.correct) cls+=' correct';
        else if(ans===oi) cls+=' incorrect';
      } else if(ans===oi) cls+=' selected';
      h+=`<button class="${cls}" onclick="App.selectQuizAnswer(${qi},${oi})" ${OBS.quizSubmitted?'disabled':''}>${opt}</button>`;
    });
    h+='</div>';
  });
  if(OBS.quizSubmitted){
    const score = quizScore();
    const pct = Math.round((score/QUIZ.length)*100);
    const name = OBS.studentName ? OBS.studentName : 'Student';
    h += `<div class="quiz-congrats">
      <div style="font-size:15px;font-weight:700;">🎉 Congratulations, ${name}!</div>
      <div class="score-big">${score} / ${QUIZ.length}</div>
      <div style="font-size:12.5px;color:var(--muted);">You scored ${pct}% on the quiz. Your quiz answers are included in the report below.</div>

    </div>
    <div class="field-row" style="margin-top:6px;"><button class="btn btn-secondary" onclick="App.retryQuiz()">🔁 Retry Quiz</button></div>
    ${renderFeedbackHTML()}`;
  } else {
    h += `<button class="btn btn-accent" onclick="App.submitQuiz()">Submit Quiz</button>`;
  }
  return h;
}
function selectQuizAnswer(qi,oi){ if(OBS.quizSubmitted) return; OBS.quizAnswers[qi]=oi; render(); }
function quizScore(){ return QUIZ.reduce((s,item,qi)=>s+(OBS.quizAnswers[qi]===item.correct?1:0),0); }
function submitQuiz(){ OBS.quizSubmitted=true; UI.__quizSubmittedForReport=true; showToast('Quiz submitted — score '+quizScore()+'/'+QUIZ.length,'good'); render(); }
function retryQuiz(){ OBS.quizAnswers={}; OBS.quizSubmitted=false; pickQuizSet(); render(); }

/* ---- POST-QUIZ FEEDBACK: free-text box + 5-point smiley/star rating ---- */
const FEEDBACK_FACES = [
  {n:1, emoji:'😠', label:'Poor',      color:'#e74c3c'},

}

/* ---- STAGE 2 of 8 — PRINCIPLE OF THE EXPERIMENT ---- */
function renderPrincipleStage(){
  return stageHeader('📖','Principle of the Experiment','Read the principle behind circular paper chromatography before starting the practical.') + `
  <div class="calc-step">
    <h4>🎯 Objective</h4>
    <p>To separate and identify amino acids present in a mixture using circular paper chromatography.</p>
    <h4 style="margin-top:14px;">Principle</h4>
    <p>Amino acids are separated because they have different affinities for the stationary phase (the chromatographic paper) and the mobile phase (the developing solvent). A small origin circle (~2.6 cm diameter) is marked at the centre of the paper, with a fine hanging wick threaded through a pinhole in its middle to draw solvent up from the reservoir below; known standard amino acids are then spotted at equally spaced points around this circle, alongside a spot of the unknown mixture, so every spot begins migrating from the same central region under identical conditions. During development, the solvent moves radially outward from the centre, and each amino acid migrates outward at its own characteristic rate depending on its polarity and solubility. The mixture's components are then identified by comparing their retardation factor, Rf, directly with the standards run on the very same paper.</p>
    <div class="info-note" style="margin-top:10px;">Rf = distance travelled by the solute ÷ distance travelled by the solvent front (both measured from the point of application)</div>
  </div>`;
}
