<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circular Paper Chromatography of Amino Acids — Virtual Laboratory</title>
<style>
:root{
  /* Violet/purple theme, echoing the purple-blue "Ruhemann's purple" colour
     that ninhydrin itself develops on the chromatogram — used throughout
     the app's chrome (header, nav, buttons, panels, progress, accents).
     Scientific/functional colours (standard identities, glassware, the
     oven, the mist) are intentionally left untouched. */
  --primary:#6d3fa0; --primary-dark:#492569; --primary-light:#f1e7fb;
  --accent:#f2a30f; --accent-dark:#c98300;
  --ink:#2a2140; --muted:#6c6180; --border:#e3d9f0; --bg:#f5f0fa;
  --good:#1e8a5f; --warn:#c98300; --bad:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
header.topbar{background:linear-gradient(120deg,var(--primary-dark),var(--primary));color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
header.topbar h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px;}
header.topbar .sub{font-size:12px;opacity:.85;margin-top:2px;}
.topbar-right{display:flex;gap:8px;flex-wrap:wrap;}
.pill-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;}
.pill-btn:hover{background:rgba(255,255,255,.26);}
.progress-wrap{background:rgba(255,255,255,.18);height:7px;}
.progress-fill{background:var(--accent);height:100%;width:0%;transition:width .4s ease;}
.progress-text{color:#fff;font-size:11.5px;padding:4px 22px;background:var(--primary-dark);display:flex;justify-content:space-between;}
.layout{display:flex;gap:18px;padding:18px;align-items:flex-start;max-width:1500px;margin:0 auto;}
aside.nav-panel{width:230px;flex-shrink:0;background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:14px;}
aside.nav-panel h4{margin:2px 0 10px;font-size:13px;color:var(--primary-dark);}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;font-size:12.6px;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .num{width:20px;height:20px;border-radius:50%;background:#ece3f6;color:var(--muted);font-size:10.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;}
.nav-item.done .num{background:var(--good);color:#fff;}
.nav-item.current{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}
.nav-item.current .num{background:var(--primary);color:#fff;}
.nav-item.locked{opacity:.5;cursor:not-allowed;}
main.workspace{flex:1;min-width:0;background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
aside.obs-panel{width:290px;flex-shrink:0;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:14px;}
aside.obs-panel h3{font-size:14px;color:var(--primary-dark);margin:0 0 8px;}
table.obs-table{width:100%;border-collapse:collapse;font-size:12px;}
table.obs-table td{padding:5px 4px;border-bottom:1px solid var(--border);}
table.obs-table td.val{text-align:right;font-weight:700;color:var(--ink);}
.feedback-box{background:#fff8ea;border:1px solid #f4d59a;border-radius:8px;padding:10px 12px;font-size:12.3px;color:#7a5300;margin-top:6px;}
.stage-title{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
.stage-title h2{margin:0;font-size:20px;color:var(--primary-dark);}
.badge{background:var(--primary-light);color:var(--primary-dark);font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;}
.stage-sub{color:var(--muted);font-size:13px;margin-bottom:9px;}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.12s;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-primary:disabled{background:#c7bcd6;cursor:not-allowed;}
.btn-secondary{background:#f5f0fa;color:var(--ink);border:1px solid var(--border);}
.btn-secondary:hover{background:#e9dff4;}
.btn-secondary:disabled{opacity:.5;cursor:not-allowed;}
.btn-accent{background:var(--accent);color:#442c00;}
.btn-accent:hover{background:var(--accent-dark);color:#fff;}
.btn-accent:disabled{background:#e8d9b8;color:#a08a5c;cursor:not-allowed;}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary);}
.btn-outline:hover{background:var(--primary-light);}
.btn-danger{background:#fdecea;color:#9c2c22;border:1px solid #f3b3ac;}
.btn-sm{padding:6px 12px;font-size:11.8px;}
.field-row{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:4px;min-width:150px;}
.field label{font-size:12px;font-weight:600;color:var(--muted);}
.field input,.field select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;}
.info-note{background:#f3edfb;border:1px solid #d9c8ee;border-radius:8px;padding:8px 12px;font-size:12.8px;color:#4a2f74;margin:6px 0;}
.warn-note{background:#fff4e5;border:1px solid #f4d59a;border-radius:8px;padding:10px 12px;font-size:12.8px;color:#8a5a00;margin:10px 0;}
.error-note{background:#fdecea;border:1px solid #f3b3ac;border-radius:8px;padding:10px 12px;font-size:12.8px;color:#9c2c22;margin:10px 0;}
.good-note{background:#eaf7f0;border:1px solid #b9e3ca;border-radius:8px;padding:10px 12px;font-size:12.8px;color:#1e6b45;margin:10px 0;}
.calc-step{background:#fdfbfe;border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;}
.calc-step h4{color:var(--primary-dark);font-size:13px;margin:0 0 6px;}
.why-btn{background:none;border:1px solid var(--primary);color:var(--primary);border-radius:12px;font-size:10.5px;font-weight:700;padding:2px 9px;cursor:pointer;margin-left:6px;}
.why-box{background:#f8f3fc;border-left:3px solid var(--primary);padding:8px 12px;font-size:12.2px;color:var(--muted);margin:6px 0 10px;border-radius:0 6px 6px 0;}
.tooltip-host{position:relative;display:inline-block;}
.tooltip-host .tip-bubble{visibility:hidden;opacity:0;position:absolute;bottom:125%;left:50%;transform:translateX(-50%);background:#2a2140;color:#fff;font-size:11px;padding:6px 9px;border-radius:6px;white-space:nowrap;transition:opacity .15s;z-index:20;}
.tooltip-host:hover .tip-bubble{visibility:visible;opacity:1;}
footer.footbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 22px;background:#fff;border-top:1px solid var(--border);position:sticky;bottom:0;gap:12px;}
footer.footbar #btnPrev{justify-self:start;}
footer.footbar .footer-center{grid-column:2;justify-self:center;}
footer.footbar #footHint{grid-column:3;justify-self:end;text-align:right;}
.prepared-by-credit{text-align:center;font-size:11.5px;color:var(--muted);padding:8px 12px 14px;background:#fff;}
@media (max-width:760px){
  footer.footbar{grid-template-columns:1fr;justify-items:center;text-align:center;}
  footer.footbar #btnPrev{justify-self:center;order:2;}
  footer.footbar .footer-center{order:1;}
  footer.footbar #footHint{justify-self:center;text-align:center;order:3;}
}
/* A gentle "ready to click" pulse for primary call-to-action buttons —
   used once a step's next action actually becomes available, so the
   student's eye is drawn to it without anything flashing harshly. */
@keyframes ctaPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(109,63,160,.55);}
  50%{box-shadow:0 0 0 9px rgba(109,63,160,0);}
}
.btn-cta{animation:ctaPulse 1.7s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){ .btn-cta{animation:none;} }
/* A blinking instructional hint (text, not a button) shown above the
   paper while a drag-based action is expected next. */
@keyframes blinkHint{0%,100%{opacity:1;}50%{opacity:.3;}}
.blink-hint{animation:blinkHint 1.3s ease-in-out infinite;color:var(--primary-dark);font-weight:700;font-size:13px;text-align:center;margin:0 0 10px;}
@media (prefers-reduced-motion: reduce){ .blink-hint{animation:none;} }
.modal-overlay{position:fixed;inset:0;background:rgba(20,30,33,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-box{background:#fff;border-radius:12px;padding:22px 24px;max-width:560px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto;}
.modal-box h3{margin:0 0 10px;font-size:16px;color:var(--primary-dark);}
.modal-box p{font-size:13px;color:var(--muted);line-height:1.55;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
.toast-host{position:fixed;bottom:70px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:300;}
.toast{background:var(--primary-dark);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.8px;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:toast-in .25s ease;max-width:320px;}
.toast.warn{background:#8a5a00;}
.toast.bad{background:#9c2c22;}
.toast.good{background:#1e6b45;}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===== Laboratory bench visuals ===== */
.bench{background:radial-gradient(ellipse at 50% 100%,#f4fafc 0%,#f5f0fa 70%);border-radius:12px;padding:18px;display:flex;flex-wrap:wrap;gap:26px;align-items:center;justify-content:center;margin:10px 0;position:relative;min-height:260px;}
.bench-split{justify-content:space-between;flex-wrap:nowrap;padding-left:8px;}
.bench-split .paper-wrap{margin-left:3px;flex-shrink:0;}
.bench-side-panel{background:#fff;border:1px solid #e3d9f0;border-radius:10px;padding:12px 14px;box-shadow:0 3px 10px rgba(0,0,0,.09);flex:0 1 auto;}
.bench-side-panel h4{margin:0 0 6px;font-size:13.5px;}
.bench-side-panel p{font-size:11.5px;margin:0 0 8px;}
.bench-side-panel select{width:100%;}
@media (max-width:760px){ .bench-split{flex-wrap:wrap;justify-content:center;} .bench-split .paper-wrap{margin-left:0;} }
.paper-wrap{position:relative;width:340px;height:340px;flex-shrink:0;touch-action:none;}
.chamber-wrap{position:relative;width:340px;height:340px;flex-shrink:0;}
/* A stylised glass Petri-dish developing chamber, viewed straight down from
   above (a true top view) — the round dish rim, a ring of solvent, and the
   circular paper sitting flat and centred inside it, all drawn as plain
   circles so the whole thing reads as one consistent overhead view (matching
   how the sealed chamber actually looks once development is underway), plus
   a translucent lid highlight over the whole dish. The wick sits directly
   under the paper's centre and isn't visible from this angle. */
.petri-chamber{position:relative;width:300px;height:300px;margin:0 auto;}
.petri-dish-svg{position:absolute;left:0;top:0;width:100%;height:100%;}
.petri-paper-flat{position:absolute;left:50%;top:50%;width:206px;height:206px;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 4px rgba(20,40,45,.15));z-index:1;}
.petri-paper-flat svg.paper-svg{width:100%;height:100%;overflow:visible;}
.petri-lid-on{position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none;}
.petri-caption{text-align:center;margin-top:6px;color:var(--muted);font-size:11.5px;}
@media (max-width:640px){ .petri-chamber{width:250px;height:250px;} .petri-paper-flat{width:172px;height:172px;} }
/* Realistic photo frames for the "placing the chromatogram in the
   developing chamber" sequence (opening → lowering → placed → closing →
   sealed) — a fixed-size stage so each frame swaps in at the same size
   without the surrounding layout jumping, styled like a framed photo to
   sit comfortably in the app's otherwise flat, illustrated UI. */
.chamber-photo-wrap{width:100%;max-width:380px;margin:4px auto 0;}
.chamber-photo{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 5px 16px rgba(20,40,45,.22);background:#dfe4e6;}
@media (max-width:640px){ .chamber-photo-wrap{max-width:280px;} }
svg.paper-svg{width:100%;height:100%;overflow:visible;}
.spot-marker{cursor:pointer;transition:transform .12s;}
.spot-marker:hover{transform:scale(1.2);}
.spot-marker.selected{filter:drop-shadow(0 0 5px rgba(14,124,134,.9));}
@keyframes ptBlink{0%,100%{opacity:1;}50%{opacity:.3;}}
.pt-pending{animation:ptBlink 1s ease-in-out infinite;}
.bench-tools{display:flex;flex-direction:column;align-items:center;gap:14px;}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;}
.tool-item.disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
.tool-label{font-size:11px;color:var(--muted);font-weight:600;text-align:center;}
@keyframes standGlow{0%,100%{filter:drop-shadow(0 0 2px rgba(242,163,15,.4));}50%{filter:drop-shadow(0 0 7px rgba(242,163,15,.9));}}
.cuvette-stand{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:6px;background:linear-gradient(#e9e2d4,#cfc4ac);border-radius:8px;padding:10px 12px 8px;box-shadow:inset 0 2px 3px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.08);max-width:230px;}
.stand-slot{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;position:relative;}
.stand-slot .slot-num{position:absolute;top:2px;left:2px;font-size:9px;font-weight:800;color:#6b5f45;background:rgba(255,255,255,.7);border-radius:50%;width:14px;height:14px;line-height:14px;text-align:center;}
.stand-slot .slot-label{font-size:9.6px;font-weight:700;color:var(--ink,#2c3e42);text-align:center;line-height:1.15;min-height:22px;}
.stand-slot.current{animation:standGlow 1.1s ease-in-out infinite;}
.stand-slot.current .slot-label{color:#8a5a00;}
.cap-grab{cursor:grab;touch-action:none;}
.cap-grab:active{cursor:grabbing;}
.stand-slot.pending{opacity:.4;cursor:not-allowed;}
.stand-slot.applied{opacity:.55;}
.stand-slot .slot-check{position:absolute;top:14px;right:0;font-size:13px;color:var(--good,#1a8a52);background:#fff;border-radius:50%;width:16px;height:16px;line-height:16px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.stand-base{width:100%;height:8px;background:linear-gradient(#8a7a5c,#6b5d43);border-radius:0 0 6px 6px;margin-top:-2px;}
.drag-ghost{position:fixed;pointer-events:none;z-index:500;opacity:.92;transform:translate(-50%,-50%);}
.progress-ring-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px;}
.dev-progress-bar{width:100%;max-width:340px;height:10px;background:#ece3f6;border-radius:6px;overflow:hidden;}
.dev-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0%;transition:width .25s linear;}
/* Realistic laboratory hot-air oven (grey metallic cabinet, blue front
   door, control panel with temperature/timer knobs and mains/heating
   indicator lights, stainless interior with a perforated tray) used for
   the separate, interactive "keep chromatogram in oven" step after
   ninhydrin spraying. The oven's SVG body is static; the door is a
   plain HTML overlay so a CSS 3D rotateY can swing it open and closed
   reliably (perspective needs a normal block-level parent, not SVG). */
.hotoven-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.22));}
.hotoven-stage{position:relative;width:240px;height:220px;flex-shrink:0;perspective:480px;}
.hotoven-stage svg{display:block;position:relative;z-index:1;}
.hotoven-heat-glow{animation:ovenPulse2 1s ease-in-out infinite;}
@keyframes ovenPulse2{0%,100%{opacity:.65;}50%{opacity:1;}}
.hotoven-door{position:absolute;z-index:3;border-radius:7px;
  background:linear-gradient(160deg,#3f7fc2,#265a94);
  border:1px solid #1c4570;box-shadow:0 2px 6px rgba(0,0,0,.3), inset 0 0 0 2px rgba(255,255,255,.08);
  transform-origin:0% 50%;transform:rotateY(0deg);backface-visibility:hidden;}
/* Open sits at -50deg rather than a near-edge-on angle — a flat 2D
   illustration viewed straight-on would make a steeper swing foreshorten
   to an near-invisible sliver, which reads as "the door vanished" rather
   than "the door is open". -50deg keeps it clearly a blue door, ajar. */
.hotoven-door.is-open{transform:rotateY(-50deg);}
.hotoven-door.anim-opening{animation:hotOvenOpen .7s ease-in-out forwards;}
.hotoven-door.anim-closing{animation:hotOvenClose .7s ease-in-out forwards;}
@keyframes hotOvenOpen{from{transform:rotateY(0deg);} to{transform:rotateY(-50deg);}}
@keyframes hotOvenClose{from{transform:rotateY(-50deg);} to{transform:rotateY(0deg);}}
.hotoven-door-handle{position:absolute;left:12px;right:12px;top:50%;height:9px;margin-top:-4.5px;border-radius:4px;
  background:linear-gradient(180deg,#e8edef,#a9b3b8);box-shadow:0 1px 2px rgba(0,0,0,.35);}
.hotoven-door-vent{position:absolute;left:7px;top:8px;bottom:8px;width:3px;border-radius:2px;background:rgba(0,0,0,.25);}
.hotoven-tray-paper{position:absolute;z-index:2;overflow:visible;transition:opacity .3s ease;}
.hotoven-tray-paper svg{width:100%;height:100%;overflow:visible;}
.hotoven-readout{width:208px;background:#12181b;border:3px solid #3a4a52;border-radius:8px;padding:8px 12px;text-align:center;}
.hotoven-readout .line1{color:#ffd76a;font-family:'Courier New',monospace;font-weight:700;font-size:13px;letter-spacing:.4px;}
.hotoven-readout .line2{color:#7be0ff;font-family:'Courier New',monospace;font-size:11px;margin-top:4px;}
.bench-fade-out{animation:benchFadeOut .5s ease forwards;}
.bench-fade-in{animation:benchFadeIn .5s ease forwards;}
@keyframes benchFadeOut{from{opacity:1;transform:scale(1);} to{opacity:0;transform:scale(.8);}}
@keyframes benchFadeIn{0%{opacity:0;transform:scale(.8);} 100%{opacity:1;transform:scale(1);}}
/* Interactive "press and hold to spray" ninhydrin step: the chromatogram
   is held vertically by forceps, facing a spray bottle on the left, with
   a continuous fine mist of small droplets travelling across the gap
   between them while the spray button is held down. */
.spray-bench{align-items:flex-start;gap:22px;flex-wrap:wrap;}
.spray-instructions{flex:0 0 226px;text-align:left;}
.spray-instructions h4{margin:0 0 8px;font-size:13.5px;color:var(--primary-dark);}
.spray-instructions ol{margin:0;padding-left:19px;font-size:12.2px;color:var(--ink);line-height:1.75;}
.spray-instructions .tip-box{margin-top:12px;background:#fff8e1;border:1px solid #f0dfa0;border-radius:8px;padding:9px 11px;font-size:11.6px;color:#6b5a12;line-height:1.55;}
.spray-visual{flex:1 1 380px;display:flex;align-items:center;justify-content:center;gap:150px;min-height:280px;position:relative;}
.spray-bottle-col{display:flex;flex-direction:column;align-items:center;gap:12px;flex-shrink:0;}
/* Wraps just the bottle photo (not the button below it) so the mist track
   can be anchored, in pixels, to the actual nozzle tip in the image —
   measured at roughly x=105,y=20 out of the photo's 140x248 displayed box
   — instead of drifting to the vertical middle of the whole flex row. */
.spray-bottle-photo-wrap{position:relative;width:140px;flex-shrink:0;}
.spray-bottle-photo{width:140px;height:auto;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.22));}
.spray-hold-btn{touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;}
.spray-hold-btn.is-active{background:var(--primary-dark);box-shadow:inset 0 2px 5px rgba(0,0,0,.35);}
.spray-mist-track{position:absolute;left:100px;top:18px;transform:translateY(-50%);width:150px;height:110px;overflow:visible;pointer-events:none;}
.mist-drop{position:absolute;left:0;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(196,218,230,.8) 55%,rgba(196,218,230,0) 100%);
  opacity:0;animation:mistFly 1.05s linear infinite;animation-play-state:paused;}
.spray-mist-track.active .mist-drop{animation-play-state:running;}
@keyframes mistFly{
  0%{opacity:0;left:0%;transform:translate(0,0) scale(.55);}
  12%{opacity:.95;}
  80%{opacity:.5;}
  100%{opacity:0;left:100%;transform:translate(0,var(--jit,0px)) scale(1.2);}
}
.spray-paper-col{position:relative;flex-shrink:0;margin-right:112px;}
.paper-wet-overlay{position:absolute;left:8%;top:8%;right:8%;bottom:8%;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(90,130,150,.55) 0%, rgba(90,130,150,.32) 60%, rgba(90,130,150,.1) 100%);
  mix-blend-mode:multiply;pointer-events:none;opacity:0;transition:opacity .18s linear;}
.forceps-svg{position:absolute;top:50%;right:-110px;transform:translateY(-50%);z-index:3;width:150px;height:auto;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.3));}
.spray-coverage-row{display:flex;justify-content:space-between;max-width:340px;margin:10px auto 4px;font-size:11.5px;color:var(--muted);font-weight:600;}
@media (max-width:760px){ .spray-bench{justify-content:center;} .spray-instructions{flex:1 1 100%;} .forceps-svg{right:-90px;} .spray-paper-col{margin-right:92px;} }
.quiz-q{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:10px;}
.quiz-q h5{margin:0 0 8px;font-size:13px;}

<script>
/* =====================================================================
   CIRCULAR PAPER CHROMATOGRAPHY OF AMINO ACIDS — VIRTUAL LABORATORY
   Vanilla HTML5 / CSS3 / JavaScript. Single file. No dependencies.
   No backend. Runs directly in a browser and on GitHub Pages.

   TECHNIQUE MODELLED: a small origin circle (~2.6 cm diameter) is marked
   at the centre of the paper. The student chooses how many standard
   amino acids to run (2, 3 or 4 — 4 recommended); the paper is then
   divided into that many + 1 equal sectors (N standards + 1 mixture of
   two of those same standards). Each standard and the mixture are
   spotted at equally spaced points around the origin circle, so every
   spot migrates radially outward from the same central region under
   identical conditions — letting the mixture's two components be
   identified by direct Rf comparison with the standards on the very
   same chromatogram.
===================================================================== */
(function(){
"use strict";

/* ---------------------------------------------------------------
   1. CONFIGURATION
--------------------------------------------------------------- */
const STAGES = [
  {id:'student',      label:'Student Details'},
  {id:'principle',    label:'Principle of Experiment'},
  {id:'procedure',    label:'How to Use This Simulator'},
  {id:'prepare',      label:'Prepare Paper & Apply Sample'},
  {id:'development',  label:'Circular Chromatographic Development'},
  {id:'detection',    label:'Ninhydrin Detection & Colour Development'},
  {id:'observation',  label:'Observation, Rf & Identification'},
  {id:'result',       label:'Result, Report & Quiz'}
];

/* Pool of reference standard amino acids the student can choose from
   (2, 3 or 4 of them are run on each paper, always taken in this
   order). Colours are shades of the purple/violet "Ruhemann's purple"
   produced when ninhydrin reacts with a free amino group. */
const STANDARD_POOL = [
  {key:'A', name:'Alanine (neutral, small)',        refRf:0.38, color:'#6a3fa0'},
  {key:'B', name:'Glycine (smallest, polar)',       refRf:0.26, color:'#2f72b0'},
  {key:'C', name:'Leucine (non-polar, bulky)',      refRf:0.80, color:'#d9a419'},
  {key:'D', name:'Tyrosine (aromatic, polar)',      refRf:0.50, color:'#c23670'},
  {key:'E', name:'Phenylalanine (aromatic, non-polar)', refRf:0.68, color:'#2e8b57'}
];
const MIXTURE_DOT_COLOR = '#6f7c82'; /* neutral slate-grey ninhydrin colour — deliberately unlike any standard's true shade, so the mixture cannot be identified by colour alone */

const CFG = {
  paperRadiusCm: 9.0,           /* physical radius represented by the drawn circle */
  paperRadiusPx: 168,           /* SVG pixel radius for the paper edge */
  centerPx: 200,                /* SVG centre (viewBox 400x400) */
  originCircleRadiusCm: 1.3,    /* ~2.6 cm diameter origin circle (30% larger than the base 2 cm) drawn at the centre */
  sampleSpotDiameterMm: 0.9,    /* correct application-spot size for a sharp chromatogram: 0.8–1 mm, applied as a fine point, not a dab */
  solventFrontRangeCm: [7.2, 8.2],   /* realistic run-to-run variation */
  rfJitter: 0.02,                /* small experimental variation around each standard's reference Rf */
  mixtureRfJitter: 0.02,         /* the mixture's own spots travel close to, but not exactly at, their matching standard's Rf — like a real repeat spot */
  frontNoisePoints: 14,          /* how many angles the uneven solvent-front shape is sampled at */
  frontNoiseAmount: 0.045,       /* max fractional wobble of the solvent front's radius by direction */
  dryDurationMs: 1800,
  chamberPhaseMs: 750,          /* real ms each of the 5 "placing in the developing chamber" photo phases stays on screen */
  developmentDurationMs: 9000,
  postDevDryMs: 2200,
  heatingDurationMs: 11000,     /* accelerated: 10 simulated minutes in the hot-air oven ≈ 11 real seconds */
  ovenDoorAnimMs: 700,          /* time for the oven door to swing fully open/closed */
  ovenTransferMs: 900,          /* time for the paper to visually move onto/off the tray */
  ovenTemperatureC: 80,         /* displayed on the oven's digital readout */
  ovenTimeMinutes: 10,          /* displayed on the oven's digital readout (real duration is heatingDurationMs) */
  sprayFullDurationMs: 4000     /* real ms of continuous press-and-hold spraying needed to reach 100% ninhydrin coverage */
};

/* ---------------------------------------------------------------
   2. EXPERIMENTAL STATE
--------------------------------------------------------------- */
let RND = {};     /* randomised values generated fresh for each run */
let OBS = {};      /* the student's observations / experiment progress */
let UI = {};        /* pure UI/interaction state (not scientific data) */

function randRange(min,max){ return min + Math.random()*(max-min); }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function fmt(n,d){ if(n===undefined||n===null||isNaN(n)) return '—'; d=(d===undefined)?2:d; return Number(n).toFixed(d); }
function shuffleArr(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* Generates one fresh, scientifically-plausible experimental run: a
   solvent-front distance, and for every standard in the pool an actual
   Rf close to its literature value (small controlled jitter) so later
   identification stays unambiguous. The pool is shuffled so that
   whichever count the student picks in Stage 1, it is a random subset
   of the pool (e.g. "any four" of the five known amino acids) rather
   than always the same fixed four (see chooseStandardsAndMixture). */
function generateRandomRun(){
  const frontCm = randRange(CFG.solventFrontRangeCm[0], CFG.solventFrontRangeCm[1]);
  const pool = shuffleArr(STANDARD_POOL).map(std=>{
    const jitter = randRange(-CFG.rfJitter, CFG.rfJitter);
    const actualRf = clamp(std.refRf + jitter, 0.05, 0.95);
    return { key:std.key, name:std.name, color:std.color, refRf:std.refRf, actualRf:Math.round(actualRf*1000)/1000 };
  });
  /* A fixed per-angle wobble for this run's solvent front, so it reads as
     a gently irregular front (thicker/thinner paper, uneven soak) rather
     than a perfect geometric circle — stable for the whole run, not
     re-randomised on every render. */
  const frontNoise = Array.from({length:CFG.frontNoisePoints}, ()=> 1 + randRange(-CFG.frontNoiseAmount, CFG.frontNoiseAmount));
  RND = { solventFrontDistanceCm: Math.round(frontCm*100)/100, pool: pool, frontNoise: frontNoise };
  /* Fresh random 10-of-40 quiz questions for this run too (see QUIZ_BANK /
     pickQuizSet, defined further down but already initialised by the time
     this ever actually runs -- generateRandomRun() is only called from the
     bootstrap at the bottom of the script and from resetExperiment()). */
  pickQuizSet();
}
/* The mixture's own spot for a given slot travels at an Rf close to, but
   not exactly identical to, the standard it truly matches — like a real
   repeat spotting of the same compound would naturally show a little
   variation — while staying clearly closest to that standard's Rf among
   whichever standards are on this paper (never crossing into ambiguous
   territory near a different standard). */
function jitteredMixtureRf(trueStd, allStandards){
  const others = allStandards.filter(s=>s.key!==trueStd.key).map(s=>s.actualRf);
  const nearestGap = others.length ? Math.min(...others.map(o=>Math.abs(o-trueStd.actualRf))) : 1;
  const maxJitter = Math.min(CFG.mixtureRfJitter, nearestGap*0.4);
  const val = trueStd.actualRf + randRange(-maxJitter, maxJitter);
  return Math.round(clamp(val,0.03,0.97)*1000)/1000;
}

/* Distance available for compounds to actually migrate: from the rim
   of the origin circle out to the solvent front (the classic Rf
   convention measures both distances from the point of application). */
function developableDistanceCm(){ return Math.max(0.1, RND.solventFrontDistanceCm - CFG.originCircleRadiusCm); }
/* The Rf actually used for a mixture slot's own spot (its slightly
   jittered measured value), falling back to the matching standard's Rf
   only if that hasn't been generated yet. Every place that needs the
   mixture's distance/Rf should go through this, so the drawn spot, the
   Rf-practice numbers and the report table never disagree. */
function mixtureSpotRf(slot){
  const trueKey = OBS.mixtureComponents[slot];
  const std = OBS.standards.find(s=>s.key===trueKey);
  if(OBS.mixtureActualRf && OBS.mixtureActualRf[slot]!=null) return OBS.mixtureActualRf[slot];
  return std ? std.actualRf : 0;
}

function freshObservations(){
  OBS = {
    studentName:'', instituteName:'', rollClass:'',
    originCircleDrawn:true, /* paper is supplied readymade, with the origin circle and hanging wick already marked at the centre */
    numStandards:null, standards:[], mixtureComponents:{}, /* {inner:key, outer:key} */
    originPoints:[], applyQueue:[], applyIndex:0, appliedPoints:{}, allApplied:false,
    spotDrying:false, spotDried:false,
    chamberPrepped:false, chamberLoading:false, chamberPhase:'opening', /* 'opening'|'lowering'|'placed'|'closing'|'sealed' — drives the realistic photo sequence while the paper is placed in the developing chamber */
    developmentStarted:false, developmentPaused:false, developmentProgress:0, developmentDone:false,
    postDevDrying:false, postDevDried:false,
    spraying:false, sprayCoverage:0, ninhydrinSprayed:false, heating:false, heatingProgress:0, colourDeveloped:false,
    ovenPhase:'waiting', /* 'waiting'|'opening'|'transferring'|'closing'|'heating'|'reopening'|'removing'|'done' — drives the interactive hot-air-oven step */
    selectedPointId:null,
    rfPractice:{
      inner:{input:'', checked:false, correct:null},
      outer:{input:'', checked:false, correct:null}
    },
    identification:{}, /* slot ('inner'/'outer') -> chosen standard key */
    identificationResult:{}, /* slot -> true/false */
    allIdentified:false,
    recorded:false,
    quizAnswers:{}, quizSubmitted:false,
    feedbackText:'', feedbackRating:0, feedbackSubmitted:false,
    expDate:new Date().toISOString().slice(0,10)
  };
}
function freshUI(){
  UI = { stage:0, maxStage:0, whyOpen:{} };
}
function resetExperiment(){
  cancelAllTimers();
  generateRandomRun();
  freshObservations();
  freshUI();
  render();
  showToast('New experiment run started — fresh solvent front and Rf values generated.','good');
}

/* Timer registry so Reset can cleanly cancel any in-flight animation. */
let TIMERS = [];
function setT(fn,ms){ const id=setTimeout(fn,ms); TIMERS.push(id); return id; }
function setI(fn,ms){ const id=setInterval(fn,ms); TIMERS.push(id); return id; }
function cancelAllTimers(){ TIMERS.forEach(id=>{ clearTimeout(id); clearInterval(id); }); TIMERS=[]; }

/* ---------------------------------------------------------------
   3. STAGE MANAGEMENT / NAVIGATION
--------------------------------------------------------------- */
function isStageComplete(i){
  const id = STAGES[i].id;
  switch(id){
    case 'student': return !!(OBS.studentName && OBS.studentName.trim() && OBS.instituteName && OBS.instituteName.trim());
    case 'principle': return false;  /* only marked done once the student clicks Continue and moves past it */
    case 'procedure': return false;  /* only marked done once the student clicks Begin Experiment and moves past it */
    case 'prepare': return OBS.chamberPrepped; /* auto-advances once chamber is set */
    case 'development': return OBS.postDevDried;
    case 'detection': return OBS.colourDeveloped;
    case 'observation': return OBS.allIdentified;
    case 'result': return true;
    default: return true;
  }
}
function goStage(i){
  if(i<0||i>=STAGES.length) return;
  if(i>UI.maxStage) return;
  UI.stage=i; render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function nextStage(){
  if(UI.stage<STAGES.length-1){ UI.stage++; if(UI.stage>UI.maxStage) UI.maxStage=UI.stage; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function prevStage(){ if(UI.stage>0){ UI.stage--; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
function autoAdvanceWhenReady(delay){
  setT(()=>{ if(isStageComplete(UI.stage) && UI.stage<STAGES.length-1){ nextStage(); } }, delay||900);
}

/* ---------------------------------------------------------------
   4. RENDER SHELL
--------------------------------------------------------------- */
function render(){
  renderNav(); renderHeader(); renderStage(); renderObsPanel(); renderFooter();
}
function renderNav(){
  const nav=document.getElementById('stageNav');
  let h='<h4>Laboratory Stages</h4>';
  STAGES.forEach((s,i)=>{
    let cls='nav-item';
    if(i===UI.stage) cls+=' current';
    else if(i>UI.maxStage) cls+=' locked';
    if(i<UI.maxStage || (i===UI.maxStage && isStageComplete(i))) cls+=' done';
    const icon = (i<UI.maxStage || (i===UI.maxStage && isStageComplete(i))) ? '✓' : (i+1);
    h+=`<div class="${cls}" onclick="App.goStage(${i})"><span class="num">${icon}</span><span>${s.label}</span></div>`;
  });
  nav.innerHTML=h;
}
function renderHeader(){
  const pct=Math.round((UI.maxStage/(STAGES.length-1))*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent='Progress: '+pct+'%';
  document.getElementById('stageText').textContent='Stage '+(UI.stage+1)+' of '+STAGES.length;
}
/* The one generic "move forward" action for the current stage (Continue /
   Begin Experiment / Continue to Result & Report, etc.), shown centred in
   the footer ribbon instead of buried inside the workspace card. Returns
   null when the current stage has no such generic action right now (either
   because a domain-specific button — Air Dry, Place in Oven, etc. — is the
   real next step, or because nothing is ready yet). `ready:true` triggers
   the pulsing "ready to click" treatment; the Student Details case is
   shown as soon as the stage loads but only starts pulsing once both
   required fields are filled in (clicking it early still explains what's
   missing, exactly as before). */
function computeFooterAction(){
  const id = STAGES[UI.stage].id;
  if(id==='student'){
    return { label:'Continue →', onClick:beginFromStudentDetails,
      ready: !!(OBS.studentName && OBS.studentName.trim() && OBS.instituteName && OBS.instituteName.trim()) };
  }
  if(id==='principle'){
    return { label:'Continue →', onClick:nextStage, ready:true };
  }
  if(id==='procedure'){
    return { label:'Begin Experiment →', onClick:nextStage, ready:true };
  }
  if(id==='detection'){
    if(!OBS.ninhydrinSprayed && OBS.sprayCoverage>=100){
      return { label:'Continue →', onClick:finishSpraying, ready:true };
    }
    if(OBS.ovenPhase==='done'){
      return { label:'Continue →', onClick:nextStage, ready:true };
    }
    return null;
  }
  if(id==='observation'){
    if(OBS.allIdentified){
      return { label:'Continue to Result & Report →', onClick:nextStage, ready:true };
    }
    return null;
  }
  return null;
}
function renderFooter(){
  document.getElementById('btnPrev').disabled = UI.stage===0;
  const btnNext=document.getElementById('btnNext');
  const hint=document.getElementById('footHint');
  const onLatest = UI.stage===UI.maxStage;
  if(!onLatest){
    btnNext.style.display='inline-block';
    btnNext.textContent='Return to current step →';
    btnNext.disabled=false;
    btnNext.className='btn btn-primary';
    btnNext.onclick=function(){ goStage(UI.maxStage); };
    hint.textContent='You are reviewing a completed stage.';
  } else {
    const action = computeFooterAction();
    if(action){
      btnNext.style.display='inline-block';
      btnNext.textContent=action.label;
      btnNext.disabled=false;
      btnNext.className='btn btn-primary'+(action.ready?' btn-cta':'');
      btnNext.onclick=action.onClick;
    } else {
      btnNext.style.display='none';
      btnNext.onclick=null;
    }
    hint.textContent = stageHintText();
  }
}
function stageHintText(){
  const id=STAGES[UI.stage].id;
  const t={
    student:'Enter your name and institute name to begin — these appear on your final report.',
    principle:'Read the principle behind circular paper chromatography, then continue.',
    procedure:'Read how to operate this virtual simulator, then begin the experiment.',
    prepare:'Choose your standards, apply each sample in turn, then air dry the paper and place it in the developing chamber using the buttons provided.',
    development:'Start development and watch the solvent migrate — separation and drying are automatic.',
    detection:'Spray ninhydrin, then place the chromatogram in the hot-air oven to develop the colour.',
    observation:'Click each spot, calculate Rf and identify both mixture components to proceed.',
    result:'Review your report, then try the quiz.'
  };
  return t[id]||'';
}

/* ---------------------------------------------------------------
   5. TOASTS / MODALS
--------------------------------------------------------------- */
function showToast(msg,type){
  const host=document.getElementById('toastHost');
  const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');
  el.textContent=msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); },3000);
}
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }
function openObjective(){
  const host=document.getElementById('modalHost');
  host.innerHTML = `<div class="modal-overlay"><div class="modal-box">
    <h3>🎯 Objective</h3>
    <p><b>To separate and identify amino acids present in a mixture using circular paper chromatography.</b></p>
    <h3 style="margin-top:16px;">Principle</h3>
    <p>Amino acids are separated because they have different affinities for the stationary phase (the chromatographic paper) and the mobile phase (the developing solvent). A small origin circle (~2.6 cm diameter) is marked at the centre of the paper, with a fine hanging wick threaded through a pinhole in its middle to draw solvent up from the reservoir below; known standard amino acids are then spotted at equally spaced points around this circle, alongside a spot of the unknown mixture, so every spot begins migrating from the same central region under identical conditions. During development, the solvent moves radially outward from the centre, and each amino acid migrates outward at its own characteristic rate depending on its polarity and solubility. The mixture's components are then identified by comparing their retardation factor, Rf, directly with the standards run on the very same paper.</p>
    <p style="margin-top:10px;">Rf = distance travelled by the solute ÷ distance travelled by the solvent front (both measured from the point of application)</p>
    <div class="modal-actions"><button class="btn btn-primary" onclick="App.closeModal()">Got it</button></div>
  </div></div>`;
}
function openPrecautions(){
  const host=document.getElementById('modalHost');
  host.innerHTML = `<div class="modal-overlay"><div class="modal-box">
    <h3>⚠️ Laboratory Precautions</h3>
    <ul style="font-size:12.8px;color:var(--muted);line-height:1.75;padding-left:18px;">
      <li>Use a pencil (never ink) to mark every application point around the origin circle.</li>
      <li>Keep the origin circle small (~2.6 cm diameter) and the application points equally spaced around it.</li>
      <li>Apply a small, concentrated sample spot (0.8–1 mm) at each marked point — avoid excessive application, which causes streaking.</li>
      <li>Keep the chromatography chamber properly closed throughout development to maintain a saturated atmosphere.</li>
      <li>Mark the solvent front immediately after development, before it evaporates.</li>
      <li>Handle the ninhydrin reagent according to laboratory safety procedures — it stains skin.</li>
      <li>Avoid direct contact with reagents and solvents; work in a well-ventilated area.</li>
      <li>Heat the sprayed chromatogram gently and evenly to avoid scorching the paper.</li>
    </ul>
    <div class="modal-actions"><button class="btn btn-primary" onclick="App.closeModal()">Close</button></div>
  </div></div>`;
}
function confirmReset(){
  const host=document.getElementById('modalHost');
  host.innerHTML = `<div class="modal-overlay"><div class="modal-box">
    <h3>Reset Experiment?</h3><p>This clears all progress and starts a fresh randomised run (new solvent-front distance and Rf values). This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="App.closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="App.closeModal();App.resetExperiment();">Reset</button>
    </div></div></div>`;
}
function openReportModalHint(){
  const resultIdx = STAGES.findIndex(s=>s.id==='result');
  if(UI.maxStage>=resultIdx){ goStage(resultIdx); return; }
  showToast('Complete the experiment to reach the Result & Report stage.','warn');
}
function whyToggle(key){ UI.whyOpen[key]=!UI.whyOpen[key]; render(); }
function whyBtn(key){ return `<button class="why-btn" onclick="App.whyToggle('${key}')">Why?</button>`; }
function whyBox(key,text){ return UI.whyOpen[key] ? `<div class="why-box">${text}</div>` : ''; }

/* ---------------------------------------------------------------
   6. OBSERVATION PANEL
--------------------------------------------------------------- */
function ovenStatusLabel(){

/* ---------------------------------------------------------------
   7. SVG PAPER / CHROMATOGRAM RENDERING (shared by every stage
      from "origin circle drawn" onward)
--------------------------------------------------------------- */
function scalePxPerCm(){ return CFG.paperRadiusPx / CFG.paperRadiusCm; }
function originCircleRadiusPx(){ return CFG.originCircleRadiusCm*scalePxPerCm(); }
/* True-to-scale radius (SVG px) of a correctly applied 0.8–1 mm sample
   spot. At this paper's scale that works out to well under a pixel, so a
   small readability floor is applied — the spot is still drawn far smaller
   than the old oversized dot, just not literally sub-pixel and invisible. */
function sampleSpotRadiusPx(){
  const trueRadiusPx = (CFG.sampleSpotDiameterMm/20) * scalePxPerCm();
  return Math.max(trueRadiusPx, 1.5);
}
function pointDir(pt){ const r=pt.angleDeg*Math.PI/180; return {dx:Math.cos(r), dy:Math.sin(r)}; }
/* Radius (px, from the true centre) a compound of a given Rf has reached
   once the solvent front is at frontRadiusPx. Compounds sit at the rim
   of the origin circle until the front actually passes it. */
function radiusPxForRf(rf, frontRadiusPx){
  const r0 = originCircleRadiusPx();
  if(frontRadiusPx==null || frontRadiusPx<=r0) return r0;
  return r0 + rf*(frontRadiusPx-r0);
}
/* A real solvent front is never a mathematically perfect circle — the
   paper's fibres and thickness vary slightly from place to place, so the
   front creeps out a little faster or slower in different directions.
   RND.frontNoise (generated once per run, see generateRandomRun) holds a
   fixed per-angle radius multiplier close to 1.0; this turns a given
   radius into a smooth, gently irregular closed path instead of a plain
   circle, and the same noise pattern is reused at every point during the
   animation so the front's wobble stays stable as it grows outward. */
function irregularFrontPathD(cx, cy, radius){
  const noise = (RND && RND.frontNoise && RND.frontNoise.length) ? RND.frontNoise : [1,1,1,1,1,1,1,1];
  const n = noise.length;
  const pts = noise.map((mult,i)=>{
    const ang = (i/n)*Math.PI*2;
    const r = radius*mult;
    return { x: cx+Math.cos(ang)*r, y: cy+Math.sin(ang)*r };
  });
  /* Smooth closed path through the points: start at the midpoint before
     the first point, then quadratic-curve through each point to the next
     midpoint (a standard trick for a smooth closed blob). */
  const mid = (a,b)=>({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
  const m0 = mid(pts[n-1], pts[0]);
  let d = `M ${m0.x.toFixed(1)} ${m0.y.toFixed(1)} `;
  for(let i=0;i<n;i++){
    const cur = pts[i];
    const next = pts[(i+1)%n];
    const m = mid(cur,next);
    d += `Q ${cur.x.toFixed(1)} ${cur.y.toFixed(1)} ${m.x.toFixed(1)} ${m.y.toFixed(1)} `;
  }
  return d+'Z';
}

function renderPaperSVG(opts){
  opts = opts || {};
  const c = CFG.centerPx, R = CFG.paperRadiusPx;
  const r0 = originCircleRadiusPx();
  const pts = OBS.originPoints || [];
  const total = pts.length;

  let sectorLines='', sectorLabels='', originDots='', migrationMarks='', guideRings='', arrowDefs='';

  if(opts.showSectors && total>0){
    const step = 360/total;
    pts.forEach(pt=>{
      const boundaryAngle = pt.angleDeg - step/2;
      const br = boundaryAngle*Math.PI/180;
      sectorLines += `<line x1="${c}" y1="${c}" x2="${(c+Math.cos(br)*R).toFixed(1)}" y2="${(c+Math.sin(br)*R).toFixed(1)}" stroke="#e7ddc2" stroke-width="1.2"></line>`;
      const {dx,dy} = pointDir(pt);
      const lx=(c+dx*(R-13)).toFixed(1), ly=(c+dy*(R-13)).toFixed(1);
      const label = pt.isMixture ? 'Mixture' : (pt.stdShortLabel||'');
      sectorLabels += `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="9.2" font-weight="700" fill="${pt.isMixture?'#6c6180':'#492569'}">${label}</text>`;
    });
  }
  if(opts.showOriginCircle){
    sectorLines += `<circle cx="${c}" cy="${c}" r="${r0.toFixed(1)}" fill="none" stroke="#8a9aa2" stroke-width="1.4" stroke-dasharray="3 3"></circle>`;
  }
  if(opts.showGuideRings && opts.guideStandards && opts.frontRadiusPx!=null){
    /* Instead of a full dashed ring per standard, draw a short radial arrow
       from the edge of the origin circle out to that standard's spot, with
       the distance travelled (cm) labelled alongside it. */
    const dev = developableDistanceCm();
    opts.guideStandards.forEach(std=>{
      const pt = pts.find(p=>!p.isMixture && p.standardKey===std.key);
      if(!pt) return;
      const {dx,dy} = pointDir(pt);
      const rr = radiusPxForRf(std.actualRf, opts.frontRadiusPx);
      const x1=c+dx*r0, y1=c+dy*r0;
      const x2=c+dx*rr, y2=c+dy*rr;
      const travel = std.actualRf*dev;
      const markerId = 'arrowHead_'+std.key;
      arrowDefs += `<marker id="${markerId}" markerWidth="7" markerHeight="7" refX="5.4" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="${std.color}"></path></marker>`;
      guideRings += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${std.color}" stroke-width="1.5" marker-end="url(#${markerId})" opacity="0.85"></line>`;
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const offset = 10;
      const lx = mx + (-dy)*offset, ly = my + (dx)*offset;
      guideRings += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="8.6" font-weight="700" fill="${std.color}">${fmt(travel,2)} cm</text>`;
    });
  }
  if(opts.showOriginDots && total>0){
    pts.forEach(pt=>{
      const {dx,dy}=pointDir(pt);
      const mx=(c+dx*r0).toFixed(1), my=(c+dy*r0).toFixed(1);
      const applied = OBS.appliedPoints[pt.id];
      const isCurrent = opts.currentPointId===pt.id && !applied;
      const fillColor = applied ? (pt.isMixture ? MIXTURE_DOT_COLOR : (OBS.standards.find(s=>s.key===pt.standardKey)||{}).color) : '#ffffff';
      /* A faint, neutral "wet" halo is left behind the moment a point is
         applied — a visible trace that some sample was actually deposited
         there (distinct from the dot's own colour so nothing is spoiled
         before ninhydrin development). */
      const spotR = sampleSpotRadiusPx();
      const wetHalo = applied ? `<circle cx="${mx}" cy="${my}" r="${(spotR*1.9).toFixed(2)}" fill="#eaf6fa" opacity="0.55" pointer-events="none"></circle>` : '';
      /* The currently-due point gets a stable id plus a larger invisible
         hit-circle, so the capillary must actually be dragged onto (and
         released over) this exact spot — not merely anywhere on the paper —
         for the drop to register. */
      /* The current point's invisible hit-circle is drawn much larger than
         the visible dot (r=30 vs r=4.5) — releasing the capillary anywhere
         reasonably close to the blinking point counts as touching it, so
         the drop doesn't need to be pixel-perfect. Wherever it's released
         within that zone, the spot itself is always drawn fixed exactly at
         the blinking point's true coordinates, never at the drop position. */
      const dotBody = `${wetHalo}<circle cx="${mx}" cy="${my}" r="${spotR.toFixed(2)}" fill="${fillColor||'#ffffff'}" stroke="${isCurrent?'#f2a30f':'#6c6180'}" stroke-width="${isCurrent?1.8:0.9}" class="${isCurrent?'pt-pending':''}"></circle>${isCurrent?`<circle cx="${mx}" cy="${my}" r="30" fill="transparent" pointer-events="none"></circle>`:''}`;
      originDots += isCurrent ? `<g id="currentOriginTarget">${dotBody}</g>` : `<g>${dotBody}</g>`;
    });
  }
  /* Realistic ninhydrin-spot look: a soft radial-gradient "diffusion halo"
     at the spot's current position, plus a faint comet-tail streak
     connecting it back to the origin circle — instead of a flat solid
     dot — matching an actual developed chromatogram. */
  function addSpotBlob(id, dx, dy, rr, color, clickAttr, op, sel){
    const x1=(c+dx*r0), y1=(c+dy*r0);
    const x2=(c+dx*rr), y2=(c+dy*rr);
    const gradId='spotGrad_'+id, trailId='spotTrail_'+id;
    arrowDefs += `<radialGradient id="${gradId}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.88"/>
        <stop offset="55%" stop-color="${color}" stop-opacity="0.38"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="${trailId}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="${color}" stop-opacity="0"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.42"/>
      </linearGradient>`;
    /* The trail is painted as its own non-interactive element, kept OUTSIDE
       the clickable <g>, so the clickable group's bounding box stays tight
       and centred on the spot itself (a reliable click/tap target) rather
       than spanning all the way back to the origin circle. */
    migrationMarks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="url(#${trailId})" stroke-width="3.2" stroke-linecap="round" pointer-events="none" opacity="${op}"></line>`;
    migrationMarks += `<g class="spot-marker${sel}" ${clickAttr} opacity="${op}">
        <circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="9" fill="transparent" stroke="none" pointer-events="${clickAttr?'all':'none'}"></circle>
        <circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="7.5" fill="url(#${gradId})" pointer-events="none"></circle>
        <circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="2.6" fill="${color}" stroke="#fff" stroke-width="1" pointer-events="none"></circle>
      </g>`;
  }
  if(opts.showMigration && total>0){
    const op = opts.spotOpacity!=null ? opts.spotOpacity : 1;
    pts.forEach(pt=>{
      const {dx,dy}=pointDir(pt);
      if(pt.isMixture){
        ['inner','outer'].forEach(slot=>{
          const key = OBS.mixtureComponents[slot];
          const std = OBS.standards.find(s=>s.key===key);
          if(!std) return;
          /* The mixture spot travels at its OWN measured Rf — close to but
             not exactly identical to its matching standard's, like a real
             repeat spot naturally would — not a perfect copy of the
             standard's radius. */
          const spotRf = (OBS.mixtureActualRf && OBS.mixtureActualRf[slot]!=null) ? OBS.mixtureActualRf[slot] : std.actualRf;
          const rr = radiusPxForRf(spotRf, opts.frontRadiusPx);
          const sel = opts.selectedPointId===('mixture_'+slot) ? ' selected' : '';
          const clickAttr = opts.clickablePoints?`onclick="App.selectMixtureDot('${slot}')"`:'';
          addSpotBlob('mix_'+slot, dx, dy, rr, MIXTURE_DOT_COLOR, clickAttr, op, sel);
        });
      } else {
        const std = OBS.standards.find(s=>s.key===pt.standardKey);
        if(!std) return;
        const rr = radiusPxForRf(std.actualRf, opts.frontRadiusPx);
        const sel = opts.selectedPointId===('std_'+std.key) ? ' selected' : '';
        const clickAttr = opts.clickablePoints?`onclick="App.selectStandardDot('${std.key}')"`:'';
        addSpotBlob('std_'+std.key, dx, dy, rr, std.color, clickAttr, op, sel);
      }
    });
  }
  let frontCircle = '';
  if(opts.frontRadiusPx!=null){
    const frontD = irregularFrontPathD(c, c, opts.frontRadiusPx);
    frontCircle = `<path d="${frontD}" fill="none" stroke="#6d3fa0" stroke-width="2" stroke-linejoin="round" stroke-dasharray="${opts.frontDashed!==false?'6 5':'0'}"></path>`;
  }

  return `<svg class="paper-svg" viewBox="0 0 ${c*2} ${c*2}">
    <defs>
      <radialGradient id="paperGrad" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#fffdf6"/>
        <stop offset="100%" stop-color="#f6f1e2"/>
      </radialGradient>
      ${arrowDefs}
    </defs>
    <circle cx="${c}" cy="${c}" r="${R}" fill="url(#paperGrad)"></circle>
    <circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#e3d9bd" stroke-width="2"></circle>
    ${sectorLines}
    ${guideRings}
    ${frontCircle}
    ${migrationMarks}
    <g class="hanging-wick" transform="rotate(-18 ${c} ${c})">
      <rect x="${c-2.6}" y="${c-8}" width="5.2" height="16" rx="2.4" fill="#c9a56b" stroke="#8a6a3c" stroke-width="0.7"></rect>
      <line x1="${c-1.6}" y1="${c-5.5}" x2="${c+1.6}" y2="${c-3.5}" stroke="#8a6a3c" stroke-width="0.6"></line>
      <line x1="${c-1.6}" y1="${c}" x2="${c+1.6}" y2="${c+2}" stroke="#8a6a3c" stroke-width="0.6"></line>
      <line x1="${c-1.6}" y1="${c+5.5}" x2="${c+1.6}" y2="${c+7.5}" stroke="#8a6a3c" stroke-width="0.6"></line>
    </g>
    <circle cx="${c}" cy="${c}" r="2.6" fill="#3a3a2e"></circle>
    ${sectorLabels}
    ${originDots}
    ${opts.frontRadiusPx!=null && opts.frontLabel? `<text x="${(c+opts.frontRadiusPx*((RND.frontNoise&&RND.frontNoise[0])||1)+8).toFixed(1)}" y="${(c-4)}" font-size="10" fill="#492569" font-weight="700">Solvent front</text>`:''}
  </svg>`;
}

/* ---------------------------------------------------------------
   8. DRAG-AND-DROP HELPER (capillary → paper). Ninhydrin spraying uses a
      separate press-and-hold pointer interaction — see startSpraying().
      Pointer-based, works for mouse & touch. By default a plain tap/click
      on the tool also performs the action directly, as an accessible
      fallback — EXCEPT when requireDrag is true (used for applying
      capillary samples), where only an actual drag that ends on the
      target counts, matching real lab technique: the capillary must be
      carried to, and touched down on, the exact spot.
--------------------------------------------------------------- */
function attachDrag(elId, dropZoneId, onDrop, iconHTML, requireDrag){
  const el = document.getElementById(elId);
  if(!el) return;
  let startX=0,startY=0, moved=false, ghost=null;
  el.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    startX=ev.clientX; startY=ev.clientY; moved=false;
    ghost=document.createElement('div');
    ghost.className='drag-ghost';
    ghost.innerHTML=iconHTML;
    ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
    document.body.appendChild(ghost);
    function move(e){
      const dx=e.clientX-startX, dy=e.clientY-startY;
      if(Math.abs(dx)>6||Math.abs(dy)>6) moved=true;
      ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
    }
    function up(e){
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
      if(ghost) ghost.remove();
      const dropEl = document.getElementById(dropZoneId);
      let hit=false;
      if(dropEl){
        const r=dropEl.getBoundingClientRect();
        const px = moved? e.clientX : startX, py = moved? e.clientY : startY;
        hit = px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom;
      }
      if(requireDrag){
        if(moved && hit){ onDrop(); }
        else if(!moved){ showToast('Drag the capillary — touch it down on the blinking point to apply the spot; a click alone won’t apply it.','warn'); }
        else { showToast('Carry the capillary all the way to the blinking point and release it there — try again.','warn'); }
      } else {
        if(!moved || hit){ onDrop(); }
        else { showToast('Drop it directly on the target shown — try again, or simply click the tool.','warn'); }
      }
    }
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  });
}

/* ---------------------------------------------------------------
   9. STAGE 1 — PAPER PREPARATION, STANDARD SELECTION & SAMPLE APPLICATION
--------------------------------------------------------------- */
/* A small test-tube (cuvette) holding its own capillary — colourless
   solution, matching real amino-acid samples before ninhydrin staining.
   The tube body and the capillary are also available as separate pieces
   (below) so that only the fine capillary — never the tube — can be
   picked up and dragged out to spot the paper. */
function tubeOnlyHTML(){
  return `<svg width="26" height="58" viewBox="0 0 26 58" xmlns="http://www.w3.org/2000/svg">
    <rect x="4" y="16" width="18" height="38" rx="4" fill="#eef7fa" stroke="#8fb3bd" stroke-width="1.2"/>
    <rect x="6" y="30" width="14" height="22" rx="2" fill="#e4f4f8"/>
  </svg>`;
}
/* Cropped tightly to just the rod + fine tip (viewBox offset to x=6..20,
   y=0..36 of the original 26x58 drawing) — its own small bounding box, so
   the draggable/clickable area covers only the capillary, not the tube
   body beside and beneath it. */
function capillaryOnlyHTML(){
  return `<svg width="14" height="36" viewBox="6 0 14 36" xmlns="http://www.w3.org/2000/svg">
    <rect x="11.4" y="0" width="3.2" height="34" rx="1.4" fill="#eaf6fb" stroke="#6fa9b8" stroke-width="0.9"/>
    <path d="M10 0 L16 0 L13 6 Z" fill="#d4e157" stroke="#8a9a1f" stroke-width="0.8"/>
  </svg>`;
}
function standCuvetteHTML(){
  return `<div style="position:relative;width:26px;height:58px;">${tubeOnlyHTML()}<div style="position:absolute;top:0;left:6px;">${capillaryOnlyHTML()}</div></div>`;
}
/* Renders a stand holding one labelled cuvette+capillary per origin
   point (each standard, plus the unknown sample) — the student pulls
   whichever one is currently due (glowing, id="capillaryToolQueue")
   to apply it; earlier ones show a used checkmark, later ones stay
   dim until their turn. For the current slot only, the fine capillary is
   rendered as its own overlaid element (id="capillaryToolQueue") sized
   to just the rod+tip — the tube graphic beneath it is purely decorative
   and not part of the draggable target, so only the capillary itself can
   be pulled out and dragged to the paper. */
function renderCapillaryStand(currentId){
  const slots = OBS.applyQueue.map((id,i)=>{
    const pt = OBS.originPoints.find(p=>p.id===id);
    const label = pt.isMixture ? 'Sample (unknown)' : ((OBS.standards.find(s=>s.key===pt.standardKey)||{}).name||'');
    const applied = !!OBS.appliedPoints[id];
    const isCurrent = id===currentId;
    const cls = applied ? 'applied' : (isCurrent ? 'current' : 'pending');
    const title = isCurrent ? 'Drag just the capillary (not the tube) and touch it down on the blinking point' : (applied ? 'Already applied' : 'Not yet — apply in order');
    /* Once a capillary has actually been taken out and used to spot the
       paper, its tube is drawn empty — the capillary doesn't reappear
       parked back inside it, since it was carried off to the paper, not
       returned. Only slots still waiting their turn show tube+capillary
       together (the current one draggable, later ones static). */
    const tubeMarkup = isCurrent
      ? `<div style="position:relative;width:26px;height:58px;">${tubeOnlyHTML()}<div id="capillaryToolQueue" class="cap-grab" style="position:absolute;top:0;left:6px;">${capillaryOnlyHTML()}</div></div>`
      : (applied
          ? `<div style="position:relative;width:26px;height:58px;">${tubeOnlyHTML()}</div>`
          : standCuvetteHTML());
    return `<div class="stand-slot ${cls}" title="${title}">
        <span class="slot-num">${i+1}</span>
        ${tubeMarkup}
        ${applied?'<span class="slot-check">✓</span>':''}
        <span class="slot-label">${label}</span>
      </div>`;
  }).join('');
  return `<div class="bench-side-panel" style="display:flex;flex-direction:column;align-items:center;">
    <h4 style="align-self:flex-start;">🧪 Capillary Stand</h4>
    <div class="cuvette-stand">${slots}</div>
    <div class="stand-base"></div>
    <div class="tool-label" style="margin-top:4px;">Colourless solutions — Applied: ${OBS.applyIndex} / ${OBS.applyQueue.length}</div>
  </div>`;
}

/* Once the student picks how many standards to run, this lays the whole
   experiment plan out: which N standards (always taken from the pool in
   order), which 2 of those form the "unknown" mixture, and the N+1
   equally-spaced origin points (their labels, angles and apply queue). */
function chooseStandardsAndMixture(n){
  OBS.numStandards = n;
  OBS.standards = RND.pool.slice(0, n);
  const mixIdx = shuffleArr([...Array(n).keys()]).slice(0,2).sort((a,b)=>a-b);
  const compStds = mixIdx.map(i=>OBS.standards[i]).sort((a,b)=>a.actualRf-b.actualRf);
  OBS.mixtureComponents = { inner: compStds[0].key, outer: compStds[1].key };
  OBS.mixtureActualRf = {
    inner: jitteredMixtureRf(compStds[0], OBS.standards),
    outer: jitteredMixtureRf(compStds[1], OBS.standards)
  };

  const total = n+1;
  const step = 360/total;
  OBS.originPoints = OBS.standards.map((std,i)=>({
    id:'std_'+std.key, angleDeg: -90+i*step, isMixture:false, standardKey:std.key,
    label:'Standard: '+std.name, stdShortLabel:'Std '+(i+1)
  }));
  OBS.originPoints.push({ id:'mixture', angleDeg: -90+n*step, isMixture:true, standardKey:null, label:'Mixture (2 unknown amino acids)' });
  OBS.applyQueue = OBS.originPoints.map(p=>p.id);
  OBS.applyIndex = 0;
  OBS.appliedPoints = {};
  OBS.allApplied = false;
}
function confirmNumStandards(val){
  const n = parseInt(val,10);
  if(!n) return;
  chooseStandardsAndMixture(n);
  showToast('Paper divided into '+(n+1)+' equal sections — '+n+' standard'+(n>1?'s':'')+' + 1 mixture.','good');
  render();
}

function renderStandardCountSelector(){
  return `<div class="bench-side-panel" style="width:250px;">
    <h4>🧬 Select Number of Standards</h4>
    <p style="color:var(--muted);">Known standards run alongside the mixture so its components can be identified by direct comparison. <b>4 is recommended</b>.</p>
    <label style="font-size:11.5px;font-weight:700;display:block;margin-bottom:4px;">Number of standards to apply</label>
    <select id="numStdSelect" onchange="App.confirmNumStandards(this.value)">
      <option value="" selected disabled>— Select —</option>
      <option value="4">4 (Recommended)</option>
      <option value="3">3</option>
      <option value="2">2</option>
    </select>
  </div>`;
}

const CHAMBER_PHASES = [
  {key:'opening',  img:CHAMBER_PHOTO_1, caption:'Opening the developing chamber (Petri dish with the mobile-phase solvent)…'},
  {key:'lowering', img:CHAMBER_PHOTO_2, caption:'Lowering the chromatogram onto the wick, at the centre of the dish…'},
  {key:'placed',   img:CHAMBER_PHOTO_3, caption:'Chromatogram placed in the chamber, supported by the wick…'},
  {key:'closing',  img:CHAMBER_PHOTO_4, caption:'Closing the developing chamber with its lid…'},
  {key:'sealed',   img:CHAMBER_PHOTO_5, caption:'Developing chamber sealed — wick dipping into the solvent, ready for development.'}
];
function chamberPhaseIndex(phase){ const i = CHAMBER_PHASES.findIndex(p=>p.key===phase); return i<0?0:i; }
/* A realistic photo of the developing chamber at the given phase (see
   CHAMBER_PHASES), with its matching caption underneath. */
function chamberPhotoHTML(phase){
  const p = CHAMBER_PHASES[chamberPhaseIndex(phase)];
  return `<div class="chamber-photo-wrap">
    <img class="chamber-photo" src="${p.img}" alt="${p.caption}">
  </div>
  <div class="petri-caption">${p.caption}</div>`;
}
/* Stylised glass Petri-dish developing chamber, viewed straight down from
   directly above (a true top view) — dish rim, a ring of solvent, and the
   flat circular paper are all drawn as plain concentric circles so the
   whole thing reads consistently as one overhead view, matching how the
   sealed chamber actually looks once development gets under way. The wick
   sits directly beneath the paper's centre and isn't visible from this
   angle; a soft glass highlight sits over the whole dish as a lid sheen. */
function petriChamberHTML(paperSvgHtml){
  return `<div class="petri-chamber">
    <svg class="petri-dish-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="dishGlassGrad" cx="42%" cy="38%" r="65%">
          <stop offset="0%" stop-color="#eef8fa" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#b9d7de" stop-opacity="0.6"/>
        </radialGradient>
        <radialGradient id="solventGrad2" cx="42%" cy="38%" r="65%">
          <stop offset="0%" stop-color="#eef8ef" stop-opacity="0.92"/>
          <stop offset="100%" stop-color="#bfe3c9" stop-opacity="0.65"/>
        </radialGradient>
      </defs>
      <circle cx="150" cy="150" r="140" fill="url(#dishGlassGrad)" stroke="#8fb0b9" stroke-width="2"></circle>
      <circle cx="150" cy="150" r="128" fill="url(#solventGrad2)" stroke="#9fc2c9" stroke-width="1.2"></circle>
    </svg>
    <div class="petri-paper-flat">${paperSvgHtml}</div>
    <div class="petri-lid-on">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="150" cy="150" r="144" fill="#dbeef2" stroke="#7ea3ae" stroke-width="1.6" opacity="0.22"></circle>
        <circle cx="150" cy="150" r="144" fill="none" stroke="#bcd8de" stroke-width="1" opacity="0.55"></circle>
        <ellipse cx="106" cy="90" rx="44" ry="24" fill="#ffffff" opacity="0.15" transform="rotate(-20 106 90)"></ellipse>
      </svg>
    </div>
  </div>`;
}
function renderPrepare(){
  const pts = OBS.originPoints;
  let inner='';

  if(!OBS.numStandards){
    const svg = renderPaperSVG({showOriginCircle:true});
    inner = `<div class="bench bench-split">
      <div class="paper-wrap">${svg}</div>
      ${renderStandardCountSelector()}
    </div>
    <div class="info-note">You are supplied with a <b>readymade circular filter paper</b>: a small origin circle (≈2.6 cm diameter) is already marked at the centre, with a fine <b>hanging wick</b> threaded through a pinhole at its middle — this wick will dip into the solvent reservoir below and draw the solvent up into the paper during development. Use the panel on the right to choose how many standards to run.</div>`;
  } else if(!OBS.allApplied){
    const currentId = OBS.applyQueue[OBS.applyIndex];
    const currentPt = pts.find(p=>p.id===currentId);
    const svg = renderPaperSVG({showOriginCircle:true, showSectors:true, showOriginDots:true, currentPointId:currentId});
    const curLabel = currentPt.isMixture ? 'the <b>Mixture</b> sample' : ('<b>Standard — '+(OBS.standards.find(s=>s.key===currentPt.standardKey)||{}).name+'</b>');
    inner = `<div class="blink-hint">👉 Drag the capillary tip to the blinking spot to apply ${curLabel}</div>
    <div class="bench bench-split">
      <div class="paper-wrap" id="paperDropZone">${svg}</div>
      ${renderCapillaryStand(currentId)}
    </div>
    <div class="info-note">A stand on the right holds one capillary tube for each standard, plus one for the unknown sample — ${OBS.applyQueue.length} in all. <b>Drag</b> the <b>glowing</b> capillary (tube ${OBS.applyIndex+1}) across and touch it down exactly on the blinking point (orange ring) to spot ${curLabel} — a click alone won't apply it, the capillary must actually be carried there. Touch it lightly and briefly: a little sample is left behind at the point as a <b>fine, small spot</b> (0.8–1 mm), not a large or repeated dab, so it stays sharp and doesn't streak during development.</div>`;
  } else if(!OBS.spotDried){
    const svg = renderPaperSVG({showOriginCircle:true, showSectors:true, showOriginDots:true});
    if(OBS.spotDrying){
      inner = `<div class="bench"><div class="paper-wrap">${svg}</div></div>
      <div class="progress-ring-wrap"><div class="info-note" style="text-align:center;width:100%;">🌬️ Drying the applied spots…</div>
        <div class="dev-progress-bar"><div class="dev-progress-fill" id="dryFill" style="width:0%;"></div></div></div>`;
    } else {
      inner = `<div class="bench"><div class="paper-wrap">${svg}</div></div>
      <div class="good-note">✓ All ${OBS.applyQueue.length} spots (${OBS.numStandards} standards + 1 mixture) applied — they're still wet.</div>
      <div class="field-row"><button class="btn btn-primary btn-cta" onclick="App.startDrying()">🌬️ Air Dry the Paper</button></div>`;
    }
  } else if(!OBS.chamberPrepped){
    if(OBS.chamberLoading){
      inner = chamberPhotoHTML(OBS.chamberPhase);
    } else {
      const svg = renderPaperSVG({showOriginCircle:true, showSectors:true, showOriginDots:true});
      inner = `<div class="bench"><div class="paper-wrap">${svg}</div></div>
      <div class="good-note">✓ Spots dried and ready.</div>
      <div class="field-row"><button class="btn btn-primary btn-cta" onclick="App.placeInChamber()">🧫 Place Paper in Developing Chamber</button></div>`;
    }
  } else {
    inner = chamberPhotoHTML('sealed') + `
    <div class="good-note">✓ Paper placed in the developing chamber and sealed. Moving to development…</div>`;
  }
  return stageHeader('🧻','Step 1 · Preparation of Chromatographic Paper','Choose your standards, then apply each sample in turn around the ready-marked origin circle.') + inner;
}
function afterPrepareRender(){
  if(OBS.numStandards && !OBS.allApplied){
    attachDrag('capillaryToolQueue','currentOriginTarget', applyCurrentPoint, capillaryOnlyHTML(), true);
  }
}
function applyCurrentPoint(){
  if(OBS.spotDrying || OBS.allApplied) return;
  const id = OBS.applyQueue[OBS.applyIndex];
  if(!id) return;
  const pt = OBS.originPoints.find(p=>p.id===id);
  OBS.appliedPoints[id]=true;
  const label = pt.isMixture ? 'Mixture sample' : ('Standard — '+(OBS.standards.find(s=>s.key===pt.standardKey)||{}).name);
  showToast(label+' applied.','good');
  OBS.applyIndex++;
  if(OBS.applyIndex>=OBS.applyQueue.length){
    OBS.allApplied=true;
  }
  render();
}
function startDrying(){
  if(OBS.spotDrying || OBS.spotDried) return;
  OBS.spotDrying=true; render();
  const t0=Date.now();
  const timer=setI(()=>{
    const pct=clamp(((Date.now()-t0)/CFG.dryDurationMs)*100,0,100);
    const fill=document.getElementById('dryFill');
    if(fill) fill.style.width=pct+'%';
    if(pct>=100){
      clearInterval(timer);
      OBS.spotDrying=false; OBS.spotDried=true;
      showToast('Spots dried.','good');
      render();
    }
  },60);
}
/* Steps through the realistic five-frame "placing in the developing
   chamber" photo sequence (CHAMBER_PHASES: opening → lowering → placed →
   closing → sealed), CFG.chamberPhaseMs per frame, like a slow stop-motion
   GIF, before marking the chamber prepped. */
function placeInChamber(){
  if(OBS.chamberPrepped || OBS.chamberLoading) return;
  OBS.chamberLoading = true;
  OBS.chamberPhase = CHAMBER_PHASES[0].key;
  render();
  showToast('Placing paper into the developing chamber…');
  let i = 0;
  const stepNext = function(){
    i++;
    if(i>=CHAMBER_PHASES.length){
      OBS.chamberLoading = false;
      OBS.chamberPrepped = true;
      render();
      showToast('Chamber sealed — solvent reservoir ready.','good');
      autoAdvanceWhenReady(1100);
      return;
    }
    OBS.chamberPhase = CHAMBER_PHASES[i].key;
    render();
    setT(stepNext, CFG.chamberPhaseMs);
  };
  setT(stepNext, CFG.chamberPhaseMs);
}

/* ---------------------------------------------------------------
   10. STAGE 2 — CIRCULAR CHROMATOGRAPHIC DEVELOPMENT (+ auto drying)
--------------------------------------------------------------- */
function renderDevelopment(){
  if(!OBS.developmentStarted && !OBS.developmentDone){
    return stageHeader('🧪','Step 2 · Circular Chromatographic Development','The paper is now sealed inside the developing chamber, with its centre dipping into the solvent reservoir.') + `
    ${chamberPhotoHTML('sealed')}
    <div class="info-note">The solvent will rise through the paper and move <b>radially outward from the centre</b>, carrying every standard and the mixture at their own rates.</div>
    <div class="field-row">
      <button class="btn btn-primary btn-cta" onclick="App.startDevelopment()">▶ Start Development</button>
    </div>`;
  }
  /* The animated front must grow toward THIS run's actual solvent-front
     distance (well inside the paper), never toward the paper's outer edge. */
  const frontR = (OBS.developmentProgress/100) * currentFrontRadiusPx();
  const svg = renderPaperSVG({
    showOriginCircle:true, showSectors:true, showOriginDots:true,
    showMigration:true, frontRadiusPx:frontR, frontDashed:true,
    spotOpacity: OBS.developmentDone? 0 : Math.min(0.35, 0.08+OBS.developmentProgress/280)
  });
  let statusLine;
  if(OBS.postDevDried) statusLine = '<div class="good-note">✓ Chromatogram ready for detection.</div>';
  else if(OBS.postDevDrying) statusLine = '<div class="info-note">🌬️ Chromatogram drying…</div>';
  else if(OBS.developmentDone) statusLine = '<div class="good-note">✓ Chromatographic development completed. Removing paper from the chamber…</div>';
  else statusLine = `<div class="info-note">${OBS.developmentPaused?'⏸ Development paused.':'Solvent moving radially outward — components are separating.'}</div>`;

  let controls = '';
  if(!OBS.developmentDone){
    controls = `<div class="field-row">
      <button class="btn btn-secondary" onclick="App.togglePauseDevelopment()">${OBS.developmentPaused?'▶ Resume Development':'⏸ Pause Development'}</button>
    </div>`;
  }

  let html = stageHeader('🌀','Step 2 · Circular Chromatographic Development','Watch the solvent front move radially outward as the standards and mixture separate at different rates.') + `
    <div class="chamber-wrap">${petriChamberHTML(svg)}</div>
    <div class="progress-ring-wrap">
      <div style="width:100%;max-width:340px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);"><span>Development Progress</span><span>${Math.round(OBS.developmentProgress)}%</span></div>
      <div class="dev-progress-bar"><div class="dev-progress-fill" style="width:${OBS.developmentProgress}%;"></div></div>
    </div>
    ${controls}
    ${statusLine}`;
  if(OBS.postDevDrying){
    html += `<div class="dev-progress-bar" style="max-width:340px;margin:0 auto;"><div class="dev-progress-fill" id="postDryFill" style="width:0%;"></div></div>`;
  }
  return html;
}
function startDevelopment(){
  if(OBS.developmentStarted) return;
  OBS.developmentStarted=true; OBS.developmentProgress=0; OBS.developmentPaused=false;
  showToast('Chromatographic development started.','good');
  render();
  runDevelopmentTick();
}
function togglePauseDevelopment(){
  if(OBS.developmentDone) return;
  OBS.developmentPaused=!OBS.developmentPaused;
  showToast(OBS.developmentPaused?'Development paused.':'Development resumed.');
  render();
  if(!OBS.developmentPaused) runDevelopmentTick();
}
let devStartTime=null, devElapsedAtPause=0;
function runDevelopmentTick(){
  if(devStartTime===null) devStartTime=Date.now()-devElapsedAtPause;
  const timer=setI(()=>{
    if(OBS.developmentPaused){ devElapsedAtPause=Date.now()-devStartTime; return; }
    const elapsed=Date.now()-devStartTime;
    const frac=clamp(elapsed/CFG.developmentDurationMs,0,1);
    OBS.developmentProgress=frac*100;
    if(frac>=1){
      clearInterval(timer);
      OBS.developmentProgress=100; OBS.developmentDone=true;
      devStartTime=null; devElapsedAtPause=0;
      showToast('Chromatographic development completed.','good');
      render();
      setT(startPostDevDry, 1200);
      return;
    }
    if(STAGES[UI.stage].id==='development') render();
  },80);
}
function startPostDevDry(){
  OBS.postDevDrying=true; render();
  const t0=Date.now();
  const timer=setI(()=>{
    const pct=clamp(((Date.now()-t0)/CFG.postDevDryMs)*100,0,100);
    const fill=document.getElementById('postDryFill');
    if(fill) fill.style.width=pct+'%';
    if(pct>=100){
      clearInterval(timer);
      OBS.postDevDrying=false; OBS.postDevDried=true;
      showToast('Chromatogram ready for detection.','good');
      render();
      autoAdvanceWhenReady(1200);
    }
  },60);
}
