<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UV-Visible Spectrophotometer Virtual Laboratory</title>
<style>
:root{
  --primary:#0e7c86; --primary-dark:#0b5e66; --primary-light:#e3f3f4;
  --accent:#f2a30f; --accent-dark:#c98300;
  --ink:#1f2d33; --muted:#5b6b74; --border:#dfe6e9; --bg:#eef3f6;
  --good:#1e8a5f; --warn:#c98300; --bad:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
header.topbar{background:linear-gradient(120deg,var(--primary-dark),var(--primary));color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
header.topbar h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px;}
header.topbar .sub{font-size:12px;opacity:.85;margin-top:2px;}
.topbar-right{display:flex;gap:8px;flex-wrap:wrap;}
.pill-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;}
.pill-btn:hover{background:rgba(255,255,255,.26);}
.progress-wrap{background:rgba(255,255,255,.18);height:7px;}
.progress-fill{background:var(--accent);height:100%;width:0%;transition:width .4s ease;}
.progress-text{color:#fff;font-size:11.5px;padding:4px 22px;background:var(--primary-dark);display:flex;justify-content:space-between;}
.layout{display:flex;gap:18px;padding:18px;align-items:flex-start;max-width:1500px;margin:0 auto;}
aside.nav-panel{width:230px;flex-shrink:0;background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:14px;}
aside.nav-panel h4{margin:2px 0 10px;font-size:13px;color:var(--primary-dark);}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;font-size:12.6px;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .num{width:20px;height:20px;border-radius:50%;background:#e4ebed;color:var(--muted);font-size:10.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;}
.nav-item.done .num{background:var(--good);color:#fff;}
.nav-item.current{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}
.nav-item.current .num{background:var(--primary);color:#fff;}
.nav-item.locked{opacity:.5;cursor:not-allowed;}
main.workspace{flex:1;min-width:0;background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
aside.obs-panel{width:280px;flex-shrink:0;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:14px;}
aside.obs-panel h3{font-size:14px;color:var(--primary-dark);margin:0 0 8px;}
table.obs-table{width:100%;border-collapse:collapse;font-size:12px;}
table.obs-table td{padding:5px 4px;border-bottom:1px solid var(--border);}
table.obs-table td.val{text-align:right;font-weight:700;color:var(--ink);}
.feedback-box{background:#fff8ea;border:1px solid #f4d59a;border-radius:8px;padding:10px 12px;font-size:12.3px;color:#7a5300;margin-top:6px;}
.stage-title{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.stage-title h2{margin:0;font-size:20px;color:var(--primary-dark);}
.badge{background:var(--primary-light);color:var(--primary-dark);font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;}
.stage-sub{color:var(--muted);font-size:13px;margin-bottom:9px;}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.12s;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-primary:disabled{background:#b9c9cf;cursor:not-allowed;}
.btn-secondary{background:#eef3f6;color:var(--ink);border:1px solid var(--border);}
.btn-secondary:hover{background:#e1eaee;}
.btn-secondary:disabled{opacity:.5;cursor:not-allowed;}
.btn-accent{background:var(--accent);color:#442c00;}
.btn-accent:hover{background:var(--accent-dark);color:#fff;}
.btn-accent:disabled{background:#e8d9b8;color:#a08a5c;cursor:not-allowed;}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary);}
.btn-outline:hover{background:var(--primary-light);}
.btn-danger{background:#fdecea;color:#9c2c22;border:1px solid #f3b3ac;}
.btn-sm{padding:5px 12px;font-size:11.6px;}
.field-row{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;}
.field{display:flex;flex-direction:column;gap:4px;min-width:150px;}
.field label{font-size:12px;font-weight:600;color:var(--muted);}
.field input,.field select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;}
.field input:disabled{background:#f1f5f6;color:#8a9aa2;}
.info-note{background:#eef7fb;border:1px solid #c5e1ec;border-radius:8px;padding:8px 12px;font-size:12.8px;color:#2b596c;margin:6px 0;}
.warn-note{background:#fff4e5;border:1px solid #f4d59a;border-radius:8px;padding:10px 12px;font-size:12.8px;color:#8a5a00;margin:10px 0;}
.error-note{background:#fdecea;border:1px solid #f3b3ac;border-radius:8px;padding:10px 12px;font-size:12.8px;color:#9c2c22;margin:10px 0;}
.good-note{background:#eaf7f0;border:1px solid #b9e3ca;border-radius:8px;padding:10px 12px;font-size:12.8px;color:#1e6b45;margin:10px 0;}
.calc-step{background:#fbfdfe;border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin-bottom:6px;}
.calc-step h4{color:var(--primary-dark);font-size:13px;margin:0 0 4px;}
.why-btn{background:none;border:1px solid var(--primary);color:var(--primary);border-radius:12px;font-size:10.5px;font-weight:700;padding:2px 9px;cursor:pointer;margin-left:6px;}
.why-box{background:#f5fbfb;border-left:3px solid var(--primary);padding:8px 12px;font-size:12.2px;color:var(--muted);margin:6px 0 10px;border-radius:0 6px 6px 0;}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;letter-spacing:.3px;}
.tag.locked{background:#eceff0;color:#8a959a;}
.tag.active{background:#e6f4ec;color:#1e6b45;}

/* ===== INSTRUMENT (photo-realistic bench-top style, persistent across stages) ===== */
.instrument-shell{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;justify-content:center;padding:8px 6px;background:radial-gradient(ellipse at 50% 100%,#f4fafc 0%,#eef3f6 70%);border-radius:10px;margin:6px 0;}
.instrument-v2{position:relative;display:flex;gap:12px;background:linear-gradient(180deg,#f3f1ea,#e5e2d8);border:1px solid #cfcabf;border-radius:16px;padding:12px;box-shadow:0 10px 26px rgba(0,0,0,.28);width:100%;}
.lid-panel{width:34%;flex-shrink:0;background:linear-gradient(155deg,#5c6267,#3a3f43);border-radius:10px;min-height:150px;position:relative;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#c9d3d2;}
.lid-panel .seam{position:absolute;left:6px;right:6px;top:6px;bottom:6px;border:1px dashed rgba(255,255,255,.15);border-radius:6px;}
.lid-hinge-label{font-size:9.5px;letter-spacing:1px;text-align:center;color:#aebcbb;opacity:.85;}
.control-panel{flex:1;display:flex;flex-direction:column;gap:5px;background:linear-gradient(155deg,#54595d,#3d4145);border-radius:10px;padding:8px;min-width:0;}
.side-buttons-row{display:flex;gap:7px;justify-content:flex-start;padding-left:2px;}
.round-btn{width:16px;height:16px;border-radius:50%;background:linear-gradient(#dcdcdc,#a3a3a3);border:1px solid #7c7c7c;box-shadow:inset 0 1px 1px #fff,0 1px 2px rgba(0,0,0,.35);}
.screen-wrap{background:#2b2e30;border-radius:6px;padding:6px;}
.power-tab{position:absolute;right:-16px;top:50%;transform:translateY(-50%);width:30px;height:54px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6;}
.power-tab:not(.on){animation:switchPulse 1.4s ease-in-out infinite;}
@keyframes switchPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(211,71,58,.7));}50%{filter:drop-shadow(0 0 7px rgba(211,71,58,.95));}}
.power-tab.on{animation:switchOnBlink .5s ease-in-out 4;}
@keyframes switchOnBlink{0%,100%{filter:drop-shadow(0 0 2px #ff6b5e);}50%{filter:drop-shadow(0 0 13px #ff6b5e);}}
.power-callout{position:absolute;right:6px;top:-32px;display:flex;align-items:center;gap:5px;color:var(--accent-dark);font-weight:800;font-size:11.5px;background:#fff;padding:5px 10px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:7;animation:blinkAnim 1s step-start infinite;white-space:nowrap;}
.power-callout .arrow{font-size:17px;line-height:1;}
@keyframes blinkAnim{50%{opacity:.15;}}
.blink{animation:blinkAnim 1s step-start infinite;}
/* Small blinking "Press N" / "Press ENTER" prompt shown right next to the
   on-screen option or field the student should act on next. */
.press-badge{display:inline-block;background:#d94f30;color:#fff;font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:10px;letter-spacing:.3px;margin-left:8px;white-space:nowrap;animation:blinkAnim 1s step-start infinite;}
/* Pulsing glow applied to whichever physical key or on-screen action button
   is the single correct next step — fill cuvette, open lid, close lid,
   AUTO ZERO / F1, START/MEASURE, etc. */
.btn-blink{animation:btnPulseGlow 1.1s ease-in-out infinite;}
@keyframes btnPulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(217,79,48,.6);}50%{box-shadow:0 0 0 7px rgba(217,79,48,0);}}
.callout{position:absolute;background:var(--primary);color:#fff;font-size:10.5px;font-weight:700;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:5;}
.callout-list{padding-left:18px;font-size:12.6px;color:var(--muted);line-height:1.8;margin:12px 0;}
.callout-num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;font-size:10px;font-weight:700;align-items:center;justify-content:center;margin-right:6px;}

.instrument-screen{background:#07191b;border-radius:9px;padding:9px 13px;font-family:'Consolas',monospace;box-shadow:inset 0 0 12px #000;height:180px;overflow-y:auto;position:relative;box-sizing:border-box;}
.instrument-screen .row{display:flex;justify-content:space-between;font-size:12px;color:#5be0c0;padding:2.5px 0;gap:8px;}
.instrument-screen .row .k{color:#7fb8b0;}
.instrument-screen .big{font-size:32px;font-weight:700;color:#5be0c0;text-align:center;padding:9px 0;letter-spacing:1px;}
.instrument-screen .big.wl{font-size:27px;opacity:.94;}
.instrument-screen .big .unit{font-size:15px;font-weight:600;margin-left:5px;opacity:.85;}
.instrument-screen .center-msg{text-align:center;font-size:12.5px;color:#8fd6c4;padding:10px 0;}
.instrument-screen.lcd-light{background:#e7e9d9;box-shadow:inset 0 0 10px rgba(0,0,0,.2);}
.instrument-screen.lcd-light .row{color:#1c1c16;}
.instrument-screen.lcd-light .row .k{color:#1c1c16;}
.instrument-screen.lcd-light .row.dim{color:#8b8c7c;}
.instrument-screen.lcd-light .row.active-row{background:#cdd2b4;border-radius:3px;}
.instrument-screen.lcd-light .row.editable{cursor:pointer;}
.instrument-screen.lcd-light .row.editable:hover{background:#d7dbc0;border-radius:3px;}
.instrument-screen.lcd-light .center-msg{color:#1c1c16;}
.instrument-screen.lcd-light .big{color:#1c1c16;}
.instrument-screen .hdr{background:#233024;color:#e7e9d9;padding:3px 8px;margin:-12px -14px 8px;border-radius:8px 8px 0 0;font-weight:700;font-size:12px;letter-spacing:.5px;}
.instrument-screen.lcd-light .hdr{background:#2b2e26;color:#e7e9d9;}

.screen-dialog{position:relative;margin-top:8px;background:#f4f2e6;border:2px solid #4a4a3f;border-radius:4px;padding:8px 10px;color:#1a1a12;font-size:11.3px;box-shadow:2px 2px 0 rgba(0,0,0,.25);}
.screen-dialog.done{background:#e7f2e6;border-color:#2f6b3f;}
.screen-dialog .dlg-title{font-weight:800;border-bottom:1px solid #999;margin-bottom:4px;padding-bottom:3px;}
.screen-dialog .dlg-line{margin:2px 0;}

/* function/key rows below screen — persistent across all stages */
.fkey-row{display:flex;gap:6px;margin-top:3px;}
.fkey{flex:1;background:#3a3f43;color:#cfd8d6;border:1px solid #565c5f;border-radius:5px;font-size:9.5px;text-align:center;padding:3px 2px 4px;font-weight:700;cursor:pointer;}
.fkey:hover{background:#454b4f;}
.fkey span{display:block;font-weight:600;font-size:8.7px;color:#9fb3af;margin-top:1px;}
.keys-row{display:flex;gap:8px;align-items:flex-start;margin-top:4px;}
.side-arrow-pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;width:64px;flex-shrink:0;}
.side-arrow-pad .arrow-btn{background:#3a4f57;color:#eef6f8;border:1px solid #56727c;border-radius:5px;font-size:10.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px 0;}
.side-arrow-pad .arrow-btn:hover{background:#4c6570;}
.side-arrow-pad .blank-cell{visibility:hidden;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1;}
.keypad button{background:#3a4f57;color:#eef6f8;border:1px solid #56727c;border-radius:6px;padding:8px 0;font-size:14px;font-weight:600;cursor:pointer;}
.keypad button:hover{background:#4c6570;}
.keypad button.key-enter{grid-column:span 3;background:#1f7a5c;border-color:#2ea577;}
.keypad button.key-enter:hover{background:#249a70;}
.keypad button.key-clear{background:#7a3030;border-color:#a54444;}
.function-row{display:flex;gap:6px;margin-top:6px;}
.round-action-btn{flex:1;background:linear-gradient(#4a5761,#333d43);color:#e6ece9;border:1px solid #626f75;border-radius:14px;font-size:10px;font-weight:700;padding:7px 3px;cursor:pointer;text-align:center;}
.round-action-btn:hover{filter:brightness(1.15);}
.round-action-btn.green{background:linear-gradient(#7fc79a,#4c9d6c);color:#0c3320;border-color:#3f8659;font-size:12px;padding:9px 3px;}
.start-row{margin-top:6px;}
.keypad-block{flex:1;display:grid;grid-template-columns:repeat(3,1fr) repeat(2,0.95fr);grid-template-rows:repeat(4,1fr);gap:5px;grid-template-areas:
    "n7 n8 n9 .  .  "
    "n4 n5 n6 .  .  "
    "n1 n2 n3 gw az"
    "np n0 nc en ss";}
.keypad-block button{background:#3a4f57;color:#eef6f8;border:1px solid #56727c;border-radius:6px;padding:5px 0;font-size:12.5px;font-weight:600;cursor:pointer;}
.keypad-block button:hover{background:#4c6570;}
.keypad-block button.key-clear{background:#7a3030;border-color:#a54444;}
.keypad-block button.key-print{font-size:8.5px;}
.keypad-block button.side-act{border-radius:9px;font-size:8.7px;font-weight:700;padding:2px 2px;background:linear-gradient(#4a5761,#333d43);color:#e6ece9;border:1px solid #626f75;line-height:1.15;}
.keypad-block button.side-act:hover{filter:brightness(1.15);}
.keypad-block button.side-act.enter{background:#1f7a5c;border-color:#2ea577;color:#fff;font-size:10px;}
.keypad-block button.side-act.enter:hover{background:#249a70;}
.keypad-block button.side-act.green{background:linear-gradient(#7fc79a,#4c9d6c);color:#0c3320;border-color:#3f8659;font-size:9.3px;}

.instrument-compartment{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0;}
.sample-holder{width:120px;height:78px;background:#0e2528;border:2px dashed #3c5a5f;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;}
.sample-holder.lid-closed{border-style:solid;border-color:#4ee08a;}
.sample-holder.dual{width:auto;height:auto;flex-direction:column;gap:10px;padding:7px 12px;background:rgba(0,0,0,.18);border:2px dashed rgba(255,255,255,.25);border-radius:10px;}
.sample-holder.dual.lid-closed{border-style:solid;border-color:#4ee08a;}
/* Front/back (not side-by-side) layout: the "back" slot sits further along the light
   path (rendered smaller & higher, offset back) and the "front" slot is nearer the
   viewer (full size, offset further down/forward) — matching the real instrument's
   holder, with enough gap between them to read as two distinct depths. */
.cuvette-slot{display:flex;flex-direction:column;align-items:center;gap:3px;}
.cuvette-slot.back{transform:scale(.82) translateY(0px);opacity:.8;}
.cuvette-slot.front{transform:translateY(6px);}
.slot-label{font-size:8.5px;color:#cfe9e6;letter-spacing:.3px;}
.cuvette{width:22px;height:38px;background:linear-gradient(#dff2f7,#b7e0ea);border:2px solid #6fa9b8;border-radius:2px;box-shadow:0 2px 5px rgba(0,0,0,.15);}
.cuvette.empty{background:#f1f6f7;opacity:.35;}
.cuvette.blank{background:linear-gradient(#eaf6fb,#cfeaf3);}
.cuvette.sample{background:linear-gradient(#eef7d0,#dcefa0);}
.cuvette.glass{border-color:#c98300;}
.lid-label{text-align:center;font-size:10.5px;color:#c9d3d2;letter-spacing:.4px;margin-top:4px;}
/* Cuvettes physically sit inside the compartment, under the lid — once the lid is
   closed they are covered and no longer visible; only the CLOSED indicator remains. */
.sample-holder.hidden-contents{background:transparent;border-style:solid;}
.sample-holder.hidden-contents .cuvette-slot{visibility:hidden;}
/* Fill tray: dropper + cuvette(s), rendered directly in the lid/compartment area
   ("above/in front of" the compartment) so filling happens right where the
   cuvettes will be loaded, not in a separate block below the instrument. */
.fill-tray{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-bottom:8px;}
.fill-tray .slot-label{color:#cfe9e6;}
.fill-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0;}
.dropper{display:flex;flex-direction:column;align-items:center;position:relative;margin-bottom:2px;}
.dropper svg{display:block;}
.dropper .drop-anim{position:absolute;top:38px;left:50%;margin-left:-6.5px;animation:dropFall 1s ease-in infinite;}
@keyframes dropFall{0%{opacity:0;transform:translateY(-2px);}30%{opacity:1;}100%{opacity:0;transform:translateY(14px);}}
.wl-target-toggle{display:flex;gap:8px;justify-content:center;margin-top:10px;}
.wl-target-toggle button{flex:1;max-width:160px;}
.wl-target-toggle button.active{outline:2px solid var(--accent);}

canvas.spectrum-canvas{width:100%;height:280px;background:#fff;border:1px solid var(--border);border-radius:8px;cursor:crosshair;}
.hover-readout{font-family:'Consolas',monospace;font-size:12.5px;color:var(--primary-dark);background:#f4f9fa;border:1px solid var(--border);border-radius:6px;padding:6px 10px;display:inline-block;margin-top:6px;}

.scan-ticker{text-align:center;font-family:'Consolas',monospace;font-size:15px;color:#1c1c16;font-weight:800;margin:4px 0;}
.scan-arrow{color:var(--accent-dark);}

.quiz-q{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:10px;}
.quiz-q h5{margin:0 0 8px;font-size:13px;}
.quiz-opt{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;margin-bottom:6px;cursor:pointer;font-size:12.6px;}
.quiz-opt.selected{border-color:var(--primary);background:var(--primary-light);}
.quiz-opt.correct{border-color:var(--good);background:#eaf7f0;}
.quiz-opt.incorrect{border-color:var(--bad);background:#fdecea;}

footer.footbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#fff;border-top:1px solid var(--border);position:sticky;bottom:0;}

.modal-overlay{position:fixed;inset:0;background:rgba(20,30,33,.5);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal-box{background:#fff;border-radius:12px;padding:22px 24px;max-width:420px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.modal-box h3{margin:0 0 10px;font-size:16px;color:var(--primary-dark);}
.modal-box p{font-size:13px;color:var(--muted);line-height:1.5;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}

.toast-host{position:fixed;bottom:70px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:300;}
.toast{background:var(--primary-dark);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.8px;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:toast-in .25s ease;max-width:320px;}
.toast.warn{background:#8a5a00;}
.toast.bad{background:#9c2c22;}
.toast.good{background:#1e6b45;}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.instr-field label{color:#dbe7e6;}
.instr-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:10px;}

<body>

<header class="topbar">
  <div>
    <h1>🔬 UV-Visible Spectrophotometer Virtual Laboratory</h1>
    <div class="sub">Instrument Operation &amp; Handling Simulation — Pharmaceutical Analysis</div>
  </div>

    <a class="pill-btn" href="../library.html" style="text-decoration:none">← Library</a>
    <button class="pill-btn" onclick="App.openGuide()">📘 How to Use / SOP</button>
    <span class="pill-btn" id="modeIndicator">Mode: Student</span>
    <button class="pill-btn" onclick="App.toggleModePrompt()">Switch Mode</button>
    <button class="pill-btn" onclick="App.openInstructorPanel()">Instructor Panel</button>
    <button class="pill-btn" onclick="App.openPrecautions()">Precautions</button>

  </div>
</header>
<div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-text"><span id="progressText">Progress: 0%</span><span id="stageText">Stage 1 of 15</span></div>

<div class="layout">
  <aside class="nav-panel"><div id="stageNav"></div></aside>

  <aside class="obs-panel"><div id="obsPanel"></div></aside>
</div>

<footer class="footbar">
  <button class="btn btn-secondary" id="btnPrev" onclick="App.prevStage()">← Previous</button>
  <button class="btn btn-outline" onclick="App.saveObservation()">💾 Save Observation</button>
  <button class="btn btn-primary" id="btnNext" onclick="App.nextStage()">Next →</button>
</footer>

<div id="modalHost"></div>
<div class="toast-host" id="toastHost"></div>
<div id="printReportArea"></div>

<script>
/* =====================================================================
   UV-VISIBLE SPECTROPHOTOMETER VIRTUAL LABORATORY
   Vanilla JS, single-file, no external dependencies.
===================================================================== */
(function(){
"use strict";

/* ---------------------------------------------------------------
   1. CONFIGURATION & DRUG DATABASE
--------------------------------------------------------------- */
const DEFAULT_CFG = {
  instrumentRange: [190,800],
  moderateWindowNm: 20,
  variation: 'medium',       // low | medium | high
  blockOnBadWavelength: false,
  enforceCuvetteErrors: false,
  allowRetryMeasurements: true,
  instructorPassword: 'admin123'
};

const DEFAULT_DRUGS = {
  paracetamol:      { key:'paracetamol', name:'Paracetamol', enabled:true, lambdaMax:257, tolLo:252, tolHi:262, scanHi:400, scanLo:200,
                       desc:'Analgesic / antipyretic, assayed in dilute 0.1 M NaOH.', region:'UV region (200–300 nm)' },
  ibuprofen:        { key:'ibuprofen', name:'Ibuprofen', enabled:true, lambdaMax:222, tolLo:217, tolHi:227, scanHi:400, scanLo:200,
                       desc:'NSAID, assayed in alkaline or methanolic medium.', region:'UV region (200–300 nm)' },
  chloramphenicol:  { key:'chloramphenicol', name:'Chloramphenicol', enabled:true, lambdaMax:278, tolLo:273, tolHi:283, scanHi:400, scanLo:200,
                       desc:'Broad-spectrum antibiotic, assayed in water/methanol.', region:'UV region (250–350 nm)' },
  diclofenac:       { key:'diclofenac', name:'Diclofenac Sodium', enabled:true, lambdaMax:276, tolLo:271, tolHi:281, scanHi:400, scanLo:200,
                       desc:'NSAID, assayed in phosphate buffer / methanol.', region:'UV region (250–350 nm)' }
};

const VARIATION_PROFILES = {
  low:    { noiseMag:0.008, lambdaJitter:1 },
  medium: { noiseMag:0.018, lambdaJitter:2 },
  high:   { noiseMag:0.030, lambdaJitter:3 }
};

const STAGES = [
  {id:'intro',    label:'Instrument Introduction & Power ON'},
  {id:'setup',    label:'Setup, Blank & Baseline'},
  {id:'sample',   label:'Sample Loading & Measurement'},
  {id:'lmax',     label:'Spectrum & λmax / Result'},
  {id:'result',   label:'Final Observation'}
];

/* ---------------------------------------------------------------
   2. GLOBAL MUTABLE STATE
--------------------------------------------------------------- */
let CFG = deepCopy(DEFAULT_CFG);
let DRUGS = deepCopy(DEFAULT_DRUGS);
let RND = {};
let OBS = {};
let UI = {};

function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
function randRange(min,max){ return min + Math.random()*(max-min); }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function fmt(n,d){ if(n===undefined||n===null||isNaN(n)) return '—'; d=(d===undefined)?2:d; return Number(n).toFixed(d); }
function gaussianShape(x,center,sigma){ return Math.exp(-Math.pow(x-center,2)/(2*sigma*sigma)); }

function enabledDrugKeys(){ return Object.keys(DRUGS).filter(k=>DRUGS[k].enabled); }

function generateRandomData(){
  const prof = VARIATION_PROFILES[CFG.variation] || VARIATION_PROFILES.medium;
  RND = {
    peakAbsorbance: randRange(0.55,0.85),
    noiseMag: prof.noiseMag,
    lambdaShift: Math.round(randRange(-prof.lambdaJitter,prof.lambdaJitter)),
    variationProfile: CFG.variation
  };
}

function freshObservations(){
  OBS = {
    studentName:'', rollNumber:'',
    mode:null, drugKey:null,
    selectedWavelength:null, wavelengthTier:null,
    scanStart:null, scanEnd:null, scanRangeOk:null,
    cuvetteType:null,
    blankSelected:false, blankFillCount:0, blankFilled:false, blankInserted:false, blankLidOpen:false, blankLidClosed:false,
    baselineDone:false, baselineRaw:null,
    sampleFilled:false, sampleInserted:false, sampleLidOpen:false, sampleLidClosed:false,
    dirtyCuvette:false, bubble:false,
    absorbance:null, transmittancePct:null,
    observedLambdaMax:null, peakAbsorbance:null,
    measurementDone:false, scanDone:false, recorded:false,
    expDate:new Date().toISOString().slice(0,10)
  };
}

function freshUI(){
  UI = {
    stage:0, maxStage:0, mode:'student', instructorUnlocked:false,
    instrumentPower:false,
    initStep:0, initRunning:false, initDone:false,
    paramEditing:false, editField:'low',
    wlBuffer:'', lowBuffer:'', highBuffer:'',
    scanning:false, currentScanWL:null, fullSpectrumData:null,
    baselineScanning:false, currentBaselineWL:null, baselineFullData:null,
    quizAnswers:{}, quizSubmitted:false,
    whyOpen:{}, showInstructorPanel:false
  };
}

function resetExperiment(regenerate){
  if(regenerate!==false) generateRandomData();
  freshObservations();
  freshUI();
  render();
  showToast('New simulation run started. Good luck!','good');
}

/* ---------------------------------------------------------------
   3. ABSORBANCE / SPECTRUM ENGINE
--------------------------------------------------------------- */
function computeAbsorbanceAt(wl){
  const drug = DRUGS[OBS.drugKey];
  if(!drug) return 0;
  const truePeak = drug.lambdaMax + RND.lambdaShift;
  const sigma = 12.5;
  const shape = gaussianShape(wl, truePeak, sigma);
  let a = RND.peakAbsorbance*shape;
  a += randRange(-RND.noiseMag, RND.noiseMag);
  if(OBS.dirtyCuvette) a += randRange(0.02,0.05);
  if(OBS.bubble) a += (Math.random()<0.5?-1:1)*randRange(0.03,0.08);
  if(OBS.cuvetteType==='glass' && wl<340) a *= 0.15;
  return Math.max(0, Math.min(1.999, a));
}

function generateFullSpectrum(){
  const lo = Math.min(OBS.scanStart,OBS.scanEnd), hi = Math.max(OBS.scanStart,OBS.scanEnd);
  const data=[];
  for(let wl=lo; wl<=hi; wl+=1){ data.push({wl, a:computeAbsorbanceAt(wl)}); }
  return data;
}

function wavelengthTier(wl){
  const drug = DRUGS[OBS.drugKey];
  if(!drug) return null;
  if(wl>=drug.tolLo && wl<=drug.tolHi) return 1;
  const dist = Math.min(Math.abs(wl-drug.tolLo), Math.abs(wl-drug.tolHi));
  if(dist<=CFG.moderateWindowNm) return 2;
  return 3;
}

function paramsComplete(){
  if(!OBS.mode || !OBS.drugKey) return false;
  if(OBS.mode==='photometric'){
    if(OBS.selectedWavelength==null) return false;
    if(CFG.blockOnBadWavelength && OBS.wavelengthTier===3) return false;
    return true;
  } else if(OBS.mode==='spectrum'){
    if(OBS.scanStart==null||OBS.scanEnd==null) return false;
    if(CFG.blockOnBadWavelength && OBS.scanRangeOk===false) return false;
    return true;
  }
  return false;
}

/* ---------------------------------------------------------------
   4. STAGE GATING
--------------------------------------------------------------- */
function isStageComplete(i){
  const id = STAGES[i].id;
  switch(id){
    case 'intro': return UI.instrumentPower && UI.initDone;
    case 'setup':
      if(!paramsComplete()) return false;
      return OBS.cuvetteType && (!CFG.enforceCuvetteErrors || OBS.cuvetteType==='quartz') && OBS.blankFilled && OBS.blankInserted && OBS.blankLidClosed && OBS.baselineDone;
    case 'sample':
      if(!OBS.sampleInserted || !OBS.sampleLidClosed) return false;
      if(OBS.mode==='photometric') return OBS.measurementDone;
      if(OBS.mode==='spectrum') return OBS.scanDone;
      return false;
    case 'lmax': return OBS.recorded;
    case 'result': return true;
    default: return true;
  }
}

function missingReasons(i){
  const id = STAGES[i].id; const r=[];
  if(id==='intro'){
    if(!UI.instrumentPower) r.push('Press the POWER switch on the side panel.');
    else if(!UI.initDone) r.push('Wait for the initialization checklist to finish.');
  }
  if(id==='setup'){
    if(!OBS.mode) r.push('Press 1 (Photometric) or 2 (Spectrum) on the keypad to select a mode.');
    else if(!OBS.drugKey) r.push('Click a drug/analyte on the screen, or press its number on the keypad.');
    else if(OBS.mode==='photometric'){
      if(OBS.selectedWavelength==null) r.push('Press 2 on the keypad, enter a wavelength and press ENTER.');
      else if(CFG.blockOnBadWavelength && OBS.wavelengthTier===3) r.push('The selected wavelength is too far from λmax — correct it before proceeding.');
    } else if(OBS.mode==='spectrum'){
      if(OBS.scanStart==null||OBS.scanEnd==null) r.push('Press 2 on the keypad, enter the lower then the higher wavelength, and press ENTER.');
      else if(CFG.blockOnBadWavelength && OBS.scanRangeOk===false) r.push('Your scan range does not include the expected λmax — edit the range.');
    }
    if(paramsComplete()){
      if(!OBS.cuvetteType) r.push('Select a cuvette type (Quartz recommended).');
      else if(CFG.enforceCuvetteErrors && OBS.cuvetteType!=='quartz') r.push('Switch to a Quartz cuvette before continuing.');
      else if(!OBS.blankFilled) r.push('Use the dropper to fill both cuvettes with the blank solution.');
      else if(!OBS.blankLidOpen && !OBS.blankLidClosed) r.push('Open the sample compartment lid.');
      else if(!OBS.blankInserted) r.push('Place both cuvettes into the sample holder.');
      else if(!OBS.blankLidClosed) r.push('Close the sample compartment lid.');
      else if(!OBS.baselineDone) r.push(OBS.mode==='spectrum' ? 'Press the F1 (BaseCorr) key to perform baseline correction.' : 'Press the AUTO ZERO key to perform baseline correction.');
    }
  }
  if(id==='sample'){
    if(!OBS.sampleFilled) r.push('Use the dropper to fill the sample cuvette.');
    else if(!OBS.sampleLidOpen && !OBS.sampleLidClosed) r.push('Open the sample compartment lid.');
    else if(!OBS.sampleInserted) r.push('Place the sample cuvette into the holder.');
    else if(!OBS.sampleLidClosed) r.push('Close the sample compartment lid.');
    else if(OBS.mode==='photometric' && !OBS.measurementDone) r.push('Press the green START/MEASURE button.');
    else if(OBS.mode==='spectrum' && !OBS.scanDone) r.push('Press the green START/MEASURE button to begin the scan.');
  }
  if(id==='lmax' && !OBS.recorded) r.push('Click "Record Observation" to confirm the result.');
  return r;
}

/* ---------------------------------------------------------------
   5. NAVIGATION
--------------------------------------------------------------- */
function goStage(i){
  if(i<0||i>=STAGES.length) return;
  if(i>UI.maxStage){ showWarning('Step locked','Please complete the current instrument operation before continuing. Skipping steps is not permitted on a real instrument either.'); return; }
  UI.stage=i; render();
}
function nextStage(){
  if(!isStageComplete(UI.stage)){ showWarning('Step not completed', missingReasons(UI.stage).join(' ') || 'Please complete this step before continuing.'); return; }
  if(UI.stage<STAGES.length-1){ UI.stage++; if(UI.stage>UI.maxStage) UI.maxStage=UI.stage; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function prevStage(){ if(UI.stage>0){ UI.stage--; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
function saveObservation(){
  if(isStageComplete(UI.stage)) showToast('Observation saved.','good');
  else showWarning('Cannot save yet', missingReasons(UI.stage).join(' '));
  render();
}

/* ---------------------------------------------------------------
   6. RENDER SHELL
--------------------------------------------------------------- */
function render(){
  renderNav(); renderHeader(); renderStage(); renderObsPanel(); renderFooter();
}
function renderNav(){
  const nav=document.getElementById('stageNav');
  let h='<h4>Instrument Operation Stages</h4>';
  STAGES.forEach((s,i)=>{
    let cls='nav-item';
    if(i===UI.stage) cls+=' current';
    else if(i>UI.maxStage) cls+=' locked';
    if(i<UI.stage || (i<=UI.maxStage && isStageComplete(i) && i!==UI.stage)) cls+=' done';
    h+=`<div class="${cls}" onclick="App.goStage(${i})"><span class="num">${i<UI.maxStage && isStageComplete(i)?'✓':(i+1)}</span><span>${s.label}</span></div>`;
  });
  nav.innerHTML=h;
}
function renderHeader(){
  const pct=Math.round((UI.maxStage/(STAGES.length-1))*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent='Progress: '+pct+'%';
  document.getElementById('stageText').textContent='Stage '+(UI.stage+1)+' of '+STAGES.length;
  document.getElementById('modeIndicator').textContent='Mode: '+(UI.mode==='instructor'?'Instructor':'Student');
}
function renderFooter(){
  document.getElementById('btnPrev').disabled = UI.stage===0;
  const btnNext=document.getElementById('btnNext');
  btnNext.disabled = !isStageComplete(UI.stage) || UI.stage===STAGES.length-1;
  btnNext.textContent = UI.stage===STAGES.length-1 ? 'Simulation Complete' : 'Next →';
}
function renderObsPanel(){
  const drug = OBS.drugKey ? DRUGS[OBS.drugKey] : null;
  const rows = [
    ['Selected Mode', OBS.mode? (OBS.mode==='photometric'?'Photometric':'Spectrum') : '—'],
    ['Selected Drug', drug? drug.name : '—'],
    ['Reference λmax', drug? drug.lambdaMax+' nm' : '—'],
    ['Selected Wavelength', OBS.selectedWavelength? OBS.selectedWavelength+' nm' : '—'],
    ['Scan Range', (OBS.scanStart!=null&&OBS.scanEnd!=null)? (OBS.scanEnd+' – '+OBS.scanStart+' nm') : '—'],
    ['Blank Status', OBS.blankInserted&&OBS.blankLidClosed? 'Loaded (×2)' : '—'],
    ['Baseline Status', OBS.baselineDone? 'Corrected ✓' : 'Pending'],
    ['Sample Status', OBS.sampleInserted&&OBS.sampleLidClosed? 'Loaded' : '—'],
    ['Observed λmax', OBS.observedLambdaMax!=null? OBS.observedLambdaMax+' nm' : '—'],
    ['Peak / Absorbance', OBS.mode==='spectrum'? (OBS.peakAbsorbance!=null?fmt(OBS.peakAbsorbance,3):'—') : (OBS.absorbance!=null?fmt(OBS.absorbance,3):'—')],
    ['Measurement Status', (OBS.measurementDone||OBS.scanDone)? 'Complete ✓' : 'Pending']
  ];
  let h = '<h3>📋 Observation Panel</h3>';
  h += `<div class="field" style="margin-bottom:10px;"><label>Student Name</label><input type="text" value="${OBS.studentName||''}" oninput="App.setStudentName(this.value)" placeholder="Enter your name"></div>`;
  h += '<table class="obs-table"><tbody>';
  rows.forEach(r=>{ h+=`<tr><td>${r[0]}</td><td class="val">${r[1]}</td></tr>`; });
  h += '</tbody></table>';
  h += '<h3 style="margin-top:14px;">💡 Laboratory Feedback</h3>' + renderFeedback();
  document.getElementById('obsPanel').innerHTML = h;
}
function renderFeedback(){
  const tips = {
    intro:'Learn the instrument’s parts, then press the blinking POWER switch to begin — initialization starts automatically.',
    setup:'Photometric Mode reads one fixed wavelength; Spectrum Mode scans a whole range — every drug has its own characteristic λmax.',
    blank:'The blank contains everything the sample does — except the analyte itself. Both cuvettes start out identical.',
    baseline:'Auto Zero cancels the background absorbance of the solvent and cuvette in both positions.',
    sample:'Handle cuvettes by their frosted (ribbed) sides only — never touch the optical faces.',
    lmax:'Compare your observed λmax against the literature value — small deviations are normal.',
    result:'Print or save your observation before resetting for a new run.'
  };
  const id = STAGES[UI.stage].id;
  return `<div class="feedback-box">${tips[id]||''}</div>`;
}
function setStudentName(v){ OBS.studentName=v; }

/* ---------------------------------------------------------------
   7. TOASTS / MODALS
--------------------------------------------------------------- */
function showToast(msg,type){
  const host=document.getElementById('toastHost');
  const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');
  el.textContent=msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); },3200);
}
function showWarning(title,msg){
  const host=document.getElementById('modalHost');
  host.innerHTML = `<div class="modal-overlay"><div class="modal-box">
    <h3>⚠️ ${title}</h3><p>${msg}</p>
    <div class="modal-actions"><button class="btn btn-primary" onclick="App.closeModal()">OK</button></div>
  </div></div>`;
}
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }
function confirmReset(){
  const host=document.getElementById('modalHost');
  host.innerHTML = `<div class="modal-overlay"><div class="modal-box">
    <h3>Reset Simulation?</h3><p>This will power off the instrument, clear all observations, and start a fresh randomised run. This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="App.closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="App.closeModal();App.resetExperiment();">Reset</button>
    </div></div></div>`;
}
function openPrecautions(){
  const host=document.getElementById('modalHost');

/* Physical-button dispatch — behaviour depends on the current stage/state,
   exactly like a real instrument's context-sensitive keys. */
function requirePower(){
  if(!UI.instrumentPower){ showToast('Instrument is off — press the POWER switch first.','warn'); return false; }
  return true;
}
function keyPress(n){
  if(!requirePower()) return;
  const id = STAGES[UI.stage].id;
  if(id!=='setup') return;
  if(!OBS.mode){
    if(n===1){ selectMode('photometric'); return; }
    if(n===2){ selectMode('spectrum'); return; }
    showToast('That mode is not enabled in this simulation.','warn');
    return;
  }
  if(!OBS.drugKey){
    const keys = enabledDrugKeys();
    const idx = n-1;
    if(idx>=0 && idx<keys.length){ selectDrug(keys[idx]); }
    else { showToast('Press the number of a listed drug (1–'+keys.length+'), or click it on the screen.','warn'); }
    return;
  }
  if(UI.paramEditing){ digitEntry(n); return; }
  if(!paramsComplete()){
    if(n===2) toggleParamEdit();
    return;
  }
  if(!OBS.cuvetteType){
    if(n===1){ selectCuvetteType('quartz'); return; }
    if(n===2){ selectCuvetteType('glass'); return; }
    showToast('Press 1 for Quartz or 2 for Glass.','warn');
  }
}
function keyClear(){
  if(!requirePower()) return;
  const id = STAGES[UI.stage].id;
  if(id!=='setup' || !UI.paramEditing) return;
  if(OBS.mode==='photometric'){ UI.wlBuffer=''; OBS.selectedWavelength=null; OBS.wavelengthTier=null; }
  else { UI.lowBuffer=''; UI.highBuffer=''; UI.editField='low'; OBS.scanStart=null; OBS.scanEnd=null; OBS.scanRangeOk=null; }
  render();
}
function keyEnter(){
  if(!requirePower()) return;
  const id = STAGES[UI.stage].id;
  if(id!=='setup' || !UI.paramEditing) return;
  const lo=CFG.instrumentRange[0], hi=CFG.instrumentRange[1];
  if(OBS.mode==='photometric'){
    const v=parseInt(UI.wlBuffer,10);
    if(!v||v<lo||v>hi){ showToast('Enter a wavelength within the instrument range ('+lo+'–'+hi+' nm).','warn'); return; }
    OBS.selectedWavelength=v; OBS.wavelengthTier=wavelengthTier(v); UI.wlBuffer=''; UI.paramEditing=false;
    showToast('Wavelength set to '+v+' nm.','good');
    render();
    return;
  }
  const lowV=parseInt(UI.lowBuffer,10), highV=parseInt(UI.highBuffer,10);
  if(!lowV||!highV||lowV<lo||highV>hi||lowV>=highV){
    showToast('Enter the LOWER wavelength first, then a HIGHER wavelength (both within '+lo+'–'+hi+' nm).','warn');
    return;
  }
  OBS.scanEnd=lowV; OBS.scanStart=highV;
  const d=DRUGS[OBS.drugKey];
  OBS.scanRangeOk = (d.lambdaMax<=OBS.scanStart && d.lambdaMax>=OBS.scanEnd);
  UI.paramEditing=false; UI.lowBuffer=''; UI.highBuffer=''; UI.editField='low';
  if(!OBS.scanRangeOk) showToast('Scan range does not include the expected λmax.','warn');
  else showToast('Scan range set: '+OBS.scanEnd+' – '+OBS.scanStart+' nm.','good');
  render();
}
function digitEntry(n){
  if(OBS.mode==='photometric'){
    if(UI.wlBuffer.length>=3) return;
    UI.wlBuffer += String(n);
    render();
    return;
  }
  if(UI.editField==='low'){
    if(UI.lowBuffer.length<3){ UI.lowBuffer+=String(n); if(UI.lowBuffer.length>=3) UI.editField='high'; }
  } else {
    if(UI.highBuffer.length<3){ UI.highBuffer+=String(n); }
  }
  render();
}
function pressArrow(dir){
  if(!requirePower()) return;
  /* Decorative navigation keys — shown for realism, no dedicated
     function required by the current stage flow. */
}
function pressGotoWL(){
  if(!requirePower()) return;
  const id = STAGES[UI.stage].id;
  if(id!=='setup' || !OBS.mode || !OBS.drugKey){ showToast('Select a mode and drug first.','warn'); return; }
  if(!UI.paramEditing) toggleParamEdit();
}
function readyForBaseline(){ return STAGES[UI.stage].id==='setup' && OBS.blankLidClosed && !OBS.baselineDone; }
function pressAutoZero(){
  if(!requirePower()) return;
  if(!readyForBaseline()){ showToast('AUTO ZERO is used for baseline correction, once the blank is loaded and the lid is closed.','warn'); return; }
  if(OBS.mode==='spectrum'){ showToast('In Spectrum Mode, use the F1 (BaseCorr) key instead.','warn'); return; }
  autoZero();
}
function pressF(n){
  if(!requirePower()) return;
  if(n===1){
    if(readyForBaseline()){
      if(OBS.mode==='photometric'){ showToast('In Photometric Mode, use the AUTO ZERO key instead.','warn'); return; }
      startBaselineScan();
      return;
    }
    showToast('F1 (BaseCorr) is used for baseline correction, once the blank is loaded and the lid is closed.','warn');
    return;
  }
  showToast('F'+n+' — demonstration only in this simulation.');
}
function pressPrint(){
  if(!requirePower()) return;
  if(STAGES[UI.stage].id==='result'){ generateReport(); return; }
  showToast('Nothing to print yet — finish the run first.','warn');
}
function pressStart(){
  if(!requirePower()) return;
  if(STAGES[UI.stage].id!=='sample'){ showToast('START/MEASURE is used once the sample is loaded.','warn'); return; }
  if(!OBS.sampleInserted || !OBS.sampleLidClosed){ showWarning('Close the lid','Load the sample cuvette and close the sample compartment lid first.'); return; }
  if(OBS.mode==='photometric') measurePhotometric();
  else startScan();
}

const INIT_CHECKS = ['LSI Initialize','ROM Check','RAM Check','Filter Initialize','Lamp Motor Initialize','WL Motor Initialize','Xe Lamp Energy','WL Origin Search','D2 Lamp Energy','WL Check'];
function renderIntro(){
  const on = UI.instrumentPower;
  if(!on){
    const screenHTML = '';
    const overlay = `
      <div class="callout" style="top:6px;left:12%;">1</div>
      <div class="callout" style="top:34px;left:40%;">2</div>
      <div class="power-callout">Press POWER ON <span class="arrow">⬇</span></div>`;
    return stageHeader('🔬','Instrument Introduction &amp; Power ON','Meet the UV-Visible spectrophotometer, learn its parts, then press the blinking POWER switch.') +
    renderInstrumentFrame(screenHTML,{maxWidth:600, overlay}) + `
    <ol class="callout-list">
      <li><span class="callout-num">1</span><b>Sample Compartment Lid</b> — dark grey cover on the left housing the cuvette holder(s). It must be closed during every measurement.</li>
      <li><span class="callout-num">2</span><b>Control Panel</b> — display screen, F1–F4 keys, arrow keys, numeric keypad, GOTO λ / AUTO ZERO / PRINT and the green START/MEASURE button.</li>
    </ol>
    <div class="info-note">This is a virtual UV-Visible spectrophotometer, modelled on a real bench-top instrument used in pharmaceutical analysis laboratories. Click the blinking <b>POWER switch</b> on the side panel (right edge) to switch it on — initialization will start automatically.</div>
    <div class="warn-note">You must complete each step in sequence, just like operating a real laboratory instrument. Steps cannot be skipped.</div>`;
  }
  const step=UI.initStep;
  const lines = INIT_CHECKS.map((c,i)=>`<div class="row ${i>=step?'dim':''}"><span class="k">${c}</span><span>${i<step?'OK':(i===step&&UI.initRunning?'…':'')}</span></div>`).join('');
  const screenHTML = `<div class="hdr">Initialization</div>${lines}
    <div class="row" style="margin-top:6px;font-size:9.5px;opacity:.65;"><span>${new Date().toISOString().slice(0,10)}</span><span>System Ver 1.12</span></div>`;
  return stageHeader('🔬','Instrument Introduction &amp; Power ON','The instrument is initialising its subsystems automatically.') +
  renderInstrumentFrame(screenHTML,{maxWidth:600}) +
  (UI.initDone? '<div class="good-note">✓ All subsystems initialised successfully. Opening the measurement mode menu…</div>' : '<div class="info-note">The instrument is checking each subsystem automatically — please wait.</div>');
}
function powerOn(){
  if(UI.instrumentPower) return;
  UI.instrumentPower=true;
  showToast('Instrument powered on.','good');
  render();
  startInit();
}
function startInit(){
  if(UI.initRunning||UI.initDone) return;
  UI.initRunning=true; UI.initStep=0; render();
  const timer=setInterval(()=>{
    UI.initStep++;
    if(UI.initStep>=INIT_CHECKS.length){
      clearInterval(timer); UI.initRunning=false; UI.initDone=true;
      showToast('Initialization complete — instrument ready.','good');
      render();
      setTimeout(()=>{ if(UI.stage===0 && isStageComplete(0)) nextStage(); }, 700);
      return;
    }
    render();
  },400);
}

/* Photometric-mode "live" screen: a real photometer, once the wavelength is
   set, just shows the wavelength and the current absorbance reading in big
   digits -- no diagnostic rows. Used from the blank/baseline step through
   sample measurement. absValue=null shows dashes (nothing to read yet). */
function bigPhotometricScreenHTML(absValue){
  const wl = OBS.selectedWavelength;
  const absTxt = (absValue==null) ? '-----' : fmt(absValue,3);
  return `<div class="big wl">${wl!=null?fmt(wl,1):'---'}<span class="unit">nm</span></div>
    <div class="big">${absTxt}<span class="unit">ABS</span></div>`;
}
function renderSetup(){
  const done = paramsComplete();
  let screenHTML, lidHTML;
  if(!OBS.mode){
    const rows = MODE_LIST.map((m,idx)=>{
      const cls='row'+(!m.active?' dim':'');
      const trailing = m.active ? `<span class="press-badge">Press ${idx+1}</span>` : 'Not enabled';
      return `<div class="${cls}"><span class="k">${m.name}</span><span>${trailing}</span></div>`;
    }).join('');
    screenHTML = `<div class="hdr">Select Mode</div>${rows}<div class="row" style="margin-top:6px;font-size:9.5px;opacity:.7;">Click an option, or press its number on the keypad</div>`;
  } else if(!OBS.drugKey){
    const dKeys = enabledDrugKeys();
    const dRows = dKeys.map((k,idx)=>`<div class="row editable" onclick="App.selectDrug('${k}')"><span class="k">${idx+1}. ${DRUGS[k].name}</span><span>λmax≈${DRUGS[k].lambdaMax}nm</span></div>`).join('');

function selectCuvetteType(t){ OBS.cuvetteType=t; if(t==='glass') showToast('Glass cuvette selected — not recommended for UV measurements.','warn'); render(); }
function dropBlank(){

}
function openBlankLid(){
  if(OBS.blankLidOpen||OBS.blankLidClosed) return;
  if(!OBS.blankFilled){ showToast('Fill both cuvettes with blank solution first.','warn'); return; }
  OBS.blankLidOpen=true; showToast('Sample compartment lid opened.'); render();
}
function insertBlank(){
  if(!OBS.blankLidOpen){ showToast('Open the sample compartment lid first.','warn'); return; }
  if(!OBS.blankFilled) return;
  OBS.blankInserted=true; showToast('Both cuvettes placed into the sample holder.'); render();
}
function closeBlankLid(){ if(!OBS.blankInserted) return; OBS.blankLidClosed=true; OBS.blankLidOpen=false; showToast('Sample compartment lid closed.'); render(); }
function autoZero(){
  if(!OBS.blankLidClosed){ showWarning('Blank required','Baseline correction is only possible after both blank cuvettes are loaded and the lid is closed.'); return; }
  OBS.baselineDone=true;
  showToast('Auto Zero complete — baseline set to 0.000.','good');
  render();
  setTimeout(()=>{ if(STAGES[UI.stage] && STAGES[UI.stage].id==='setup' && isStageComplete(UI.stage)) nextStage(); }, 900);
}
/* Spectrum-mode baseline correction (F1): sweeps the blank across the scan range,
   high wavelength to low, exactly like the real sample scan — but since both
   cuvette positions hold the blank, the trace is a flat line near zero absorbance. */
function generateFlatBaseline(){
  const lo=Math.min(OBS.scanStart,OBS.scanEnd), hi=Math.max(OBS.scanStart,OBS.scanEnd);
  const pts=[];
  for(let wl=hi; wl>=lo; wl-=2){ pts.push({wl, a: Math.max(0, (Math.random()-0.5)*0.006 + 0.003)}); }
  return pts;
}
function startBaselineScan(){
  if(!OBS.blankLidClosed){ showWarning('Blank required','Baseline correction is only possible after both blank cuvettes are loaded and the lid is closed.'); return; }
  if(UI.baselineScanning) return;
  UI.baselineFullData = generateFlatBaseline();
  UI.baselineScanning = true; UI.currentBaselineWL = OBS.scanStart;
  render();
  const step=2;
  const timer=setInterval(()=>{
    UI.currentBaselineWL -= step;
    if(UI.currentBaselineWL<=OBS.scanEnd){ UI.currentBaselineWL=OBS.scanEnd; clearInterval(timer); finishBaselineScan(); return; }
    render();
  },70);
}
function finishBaselineScan(){
  UI.baselineScanning=false;
  OBS.baselineDone=true;
  showToast('Baseline correction complete — flat reference line recorded (A ≈ 0.000).','good');
  render();
  setTimeout(()=>{ if(STAGES[UI.stage] && STAGES[UI.stage].id==='setup' && isStageComplete(UI.stage)) nextStage(); }, 900);
}
function drawBaselineCanvas(canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas) return;
  if(OBS.scanStart==null||OBS.scanEnd==null) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const marginL=32, marginB=18, marginT=7, marginR=8;
  const plotW=W-marginL-marginR, plotH=H-marginT-marginB;
  const xMin=Math.min(OBS.scanStart,OBS.scanEnd), xMax=Math.max(OBS.scanStart,OBS.scanEnd);
  const data = UI.baselineFullData||[];
  const visible = data.filter(p=>p.wl>=UI.currentBaselineWL);
  const yMax = 0.5;
  ctx.strokeStyle='#6b7a63'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(marginL,marginT); ctx.lineTo(marginL,H-marginB); ctx.lineTo(W-marginR,H-marginB); ctx.stroke();
  ctx.fillStyle='#3a3a2e'; ctx.font='8px sans-serif'; ctx.textAlign='center';
  const step = (xMax-xMin)>200?50:20;
  for(let wl=Math.ceil(xMin/step)*step; wl<=xMax; wl+=step){
    const x=marginL+((wl-xMin)/(xMax-xMin))*plotW;
    ctx.fillText(wl,x,H-marginB+10);
    ctx.strokeStyle='#cfd3bd'; ctx.beginPath(); ctx.moveTo(x,marginT); ctx.lineTo(x,H-marginB); ctx.stroke();
  }
  if(visible.length>1){
    ctx.strokeStyle='#0d6e5a'; ctx.lineWidth=1.6; ctx.beginPath();
    visible.slice().sort((a,b)=>a.wl-b.wl).forEach((p,i)=>{
      const x=marginL+((p.wl-xMin)/(xMax-xMin))*plotW;
      const y=H-marginB-(p.a/yMax)*plotH;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  const x=marginL+((UI.currentBaselineWL-xMin)/(xMax-xMin))*plotW;
  ctx.strokeStyle='#f2a30f'; ctx.lineWidth=1.2; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(x,marginT); ctx.lineTo(x,H-marginB); ctx.stroke(); ctx.setLineDash([]);
}

  } else if(OBS.mode==='photometric' && !OBS.measurementDone){
    html += '<div class="info-note">Sample loaded. Press the green <b>START / MEASURE</b> button on the instrument panel above.</div>';
  } else if(OBS.mode==='spectrum' && !OBS.scanDone){
    html += '<div class="info-note">Sample loaded. Press the green <b>START / MEASURE</b> button — the instrument sweeps from the higher wavelength toward the lower wavelength ('+OBS.scanStart+' → '+OBS.scanEnd+' nm).</div>';
  } else if(OBS.mode==='photometric'){
    html += '<div id="measureMsgs"></div><div class="good-note">✓ Absorbance recorded: A = '+fmt(OBS.absorbance,3)+'. Proceed to view the result.</div>';
  } else {
    html += '<div class="good-note">✓ Spectrum acquired. Proceed to identify λmax.</div>';
  }
  return html;
}
function dropSample(){
  if(OBS.sampleFilled) return;
  OBS.sampleFilled=true;
  showToast('Cuvette filled with '+(DRUGS[OBS.drugKey]?DRUGS[OBS.drugKey].name:'sample')+' solution.','good');

}
function openSampleLid(){
  if(OBS.sampleLidOpen||OBS.sampleLidClosed) return;
  if(!OBS.sampleFilled){ showToast('Fill the sample cuvette first.','warn'); return; }
  OBS.sampleLidOpen=true; showToast('Sample compartment lid opened.'); render();
}
function insertSample(){
  if(!OBS.sampleLidOpen){ showToast('Open the sample compartment lid first.','warn'); return; }
  if(!OBS.sampleFilled) return;
  OBS.sampleInserted=true; showToast('Sample cuvette placed in the holder (front position).'); render();
}
function closeSampleLid(){ if(!OBS.sampleInserted) return; OBS.sampleLidClosed=true; OBS.sampleLidOpen=false; showToast('Sample compartment lid closed.'); render(); }
function toggleDirty(v){ OBS.dirtyCuvette=v; if(v) showToast('⚠️ Fingerprints on optical faces can affect the measurement.','warn'); }
function toggleBubble(v){ OBS.bubble=v; if(v) showToast('⚠️ Air bubbles may scatter light and introduce measurement error.','warn'); }

function measurePhotometric(){
  if(!OBS.baselineDone){ showWarning('Baseline required','Perform blank/baseline correction before measuring the sample.'); return; }
  if(!OBS.sampleLidClosed){ showWarning('Close the lid','Close the sample compartment lid before measurement.'); return; }
  const a = computeAbsorbanceAt(OBS.selectedWavelength);
  OBS.absorbance = Math.round(a*1000)/1000;
  OBS.transmittancePct = 100*Math.pow(10,-OBS.absorbance);
  OBS.measurementDone = true; OBS.recorded=false;
  const notes=[];
  if(OBS.dirtyCuvette) notes.push('Fingerprints/dirt on the optical surface can affect absorbance.');
  if(OBS.bubble) notes.push('Air bubbles in the optical path can produce erroneous readings.');
  if(OBS.cuvetteType==='glass' && OBS.selectedWavelength<340) notes.push('A glass cuvette strongly absorbs UV light — this reading is unreliable. Use quartz.');
  if(OBS.wavelengthTier===3) notes.push('The selected wavelength is far from λmax — sensitivity is greatly reduced.');
  showToast('Absorbance measured: A = '+fmt(OBS.absorbance,3),'good');
  render();
  const box=document.getElementById('measureMsgs');
  if(box) box.innerHTML = notes.map(m=>'<div class="warn-note">⚠ '+m+'</div>').join('');
}
function startScan(){
  if(!OBS.baselineDone){ showWarning('Baseline required','Perform blank/baseline correction before scanning the sample.'); return; }
  if(!OBS.sampleLidClosed){ showWarning('Close the lid','Close the sample compartment lid before scanning.'); return; }
  if(UI.scanning) return;
  UI.fullSpectrumData = generateFullSpectrum();
  UI.scanning=true; UI.currentScanWL=OBS.scanStart; OBS.scanDone=false; OBS.recorded=false;
  render();
  const step=2;
  const timer=setInterval(()=>{
    UI.currentScanWL -= step;
    if(UI.currentScanWL<=OBS.scanEnd){ UI.currentScanWL=OBS.scanEnd; clearInterval(timer); finishScan(); return; }
    render();
  },140);
}
function finishScan(){
  UI.scanning=false;
  let best=UI.fullSpectrumData[0];
  UI.fullSpectrumData.forEach(p=>{ if(p.a>best.a) best=p; });
  OBS.observedLambdaMax = best.wl;
  OBS.peakAbsorbance = Math.round(best.a*1000)/1000;
  OBS.scanDone = true;
  showToast('Spectrum scan complete. Peak identified at '+OBS.observedLambdaMax+' nm.','good');
  render();
}
function drawSpectrumCanvas(canvasId, compact){
  const canvas=document.getElementById(canvasId||'spectrumCanvas');
  if(!canvas) return;
  if(OBS.scanStart==null||OBS.scanEnd==null) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const marginL=compact?32:50, marginB=compact?18:32, marginT=compact?7:14, marginR=compact?8:14;
  const plotW=W-marginL-marginR, plotH=H-marginT-marginB;
  const xMin=Math.min(OBS.scanStart,OBS.scanEnd), xMax=Math.max(OBS.scanStart,OBS.scanEnd);
  const hasData = !!UI.fullSpectrumData;
  const visible = !hasData ? [] : (UI.scanning ? UI.fullSpectrumData.filter(p=>p.wl>=UI.currentScanWL) : (OBS.scanDone ? UI.fullSpectrumData : []));
  const yMax = hasData ? Math.max(0.1, ...UI.fullSpectrumData.map(p=>p.a))*1.25 : 2.0;
  const fontSz = compact?'8px sans-serif':'11px sans-serif';
  ctx.strokeStyle=compact?'#6b7a63':'#8fa5ad'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(marginL,marginT); ctx.lineTo(marginL,H-marginB); ctx.lineTo(W-marginR,H-marginB); ctx.stroke();
  ctx.fillStyle=compact?'#3a3a2e':'#5b6b74'; ctx.font=fontSz; ctx.textAlign='center';
  const step = (xMax-xMin)>200?(compact?50:25):20;
  for(let wl=Math.ceil(xMin/step)*step; wl<=xMax; wl+=step){
    const x=marginL+((wl-xMin)/(xMax-xMin))*plotW;
    if(!compact) ctx.fillText(wl,x,H-marginB+14); else ctx.fillText(wl,x,H-marginB+10);
    ctx.strokeStyle=compact?'#cfd3bd':'#eef3f6'; ctx.beginPath(); ctx.moveTo(x,marginT); ctx.lineTo(x,H-marginB); ctx.stroke();
  }
  if(!compact){
    ctx.fillText('Wavelength (nm)', marginL+plotW/2, H-4);
    ctx.save(); ctx.translate(14,marginT+plotH/2); ctx.rotate(-Math.PI/2); ctx.fillText('Absorbance',0,0); ctx.restore();
  }
  for(let i=0;i<=(compact?2:4);i++){
    const denom = compact?2:4;
    const val=yMax*i/denom; const y=H-marginB-(val/yMax)*plotH;
    ctx.fillStyle=compact?'#3a3a2e':'#5b6b74'; ctx.textAlign='right'; ctx.fillText(fmt(val,compact?1:2),marginL-4,y+3);
    ctx.strokeStyle=compact?'#e2e5d1':'#f2f6f7'; ctx.beginPath(); ctx.moveTo(marginL,y); ctx.lineTo(W-marginR,y); ctx.stroke();
  }
  if(visible.length>1){
    ctx.strokeStyle=compact?'#0d6e5a':'#0d6e8c'; ctx.lineWidth=compact?1.6:2.2; ctx.beginPath();
    visible.slice().sort((a,b)=>a.wl-b.wl).forEach((p,i)=>{
      const x=marginL+((p.wl-xMin)/(xMax-xMin))*plotW;
      const y=H-marginB-(p.a/yMax)*plotH;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  if(UI.scanning){
    const x=marginL+((UI.currentScanWL-xMin)/(xMax-xMin))*plotW;
    ctx.strokeStyle='#f2a30f'; ctx.lineWidth=1.4; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x,marginT); ctx.lineTo(x,H-marginB); ctx.stroke(); ctx.setLineDash([]);
  }
  if(!UI.scanning && OBS.scanDone && OBS.observedLambdaMax!=null){
    const xPeak=marginL+((OBS.observedLambdaMax-xMin)/(xMax-xMin))*plotW;
    const yPeak=H-marginB-(OBS.peakAbsorbance/yMax)*plotH;
    ctx.strokeStyle='#c62828'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(xPeak,marginT); ctx.lineTo(xPeak,H-marginB); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#c62828'; ctx.beginPath(); ctx.arc(xPeak,yPeak,compact?2.5:4,0,7); ctx.fill();
    if(!compact){
      ctx.fillStyle='#c62828'; ctx.textAlign='center'; ctx.font='bold 11px sans-serif';
      ctx.fillText('λmax ≈ '+OBS.observedLambdaMax+' nm', xPeak, yPeak-10);
    }
  }
  if(!compact){
    canvas.onmousemove = function(ev){
      if(UI.scanning||!OBS.scanDone) return;
      const rect=canvas.getBoundingClientRect();
      const scaleX=canvas.width/rect.width;
      const mx=(ev.clientX-rect.left)*scaleX;
      const wl=Math.round(xMin + ((mx-marginL)/plotW)*(xMax-xMin));
      if(wl<xMin||wl>xMax) return;
      const pt = UI.fullSpectrumData.reduce((best,p)=>Math.abs(p.wl-wl)<Math.abs(best.wl-wl)?p:best, UI.fullSpectrumData[0]);
      const readout=document.getElementById('hoverReadout');
      if(readout) readout.textContent = 'Wavelength: '+pt.wl+' nm   |   Absorbance: '+fmt(pt.a,3);
    };
  }
}

<!-- ===== Pharma Hub integration =====================================
     Links this simulation to the site's progress tracking so "Mark
     complete" here shows up on the homepage and library cards.
     The id must match the entry in resources.js.
     ================================================================== -->
<script src="../resources.js"></script>
<script src="../progress.js"></script>
<script>
(function () {
  var ID = "uv-vis-spectrophotometer";
  if (typeof Progress === "undefined") return;
  Progress.markStarted(ID);
  var btn = document.getElementById("phMarkDone");
  if (!btn) return;
  function refresh() {
    var done = Progress.get(ID) === "completed";
    btn.textContent = done ? "\u2713 Completed" : "Mark complete";
    btn.style.background = done ? "rgba(30,138,95,.9)" : "";
    btn.setAttribute("aria-pressed", done ? "true" : "false");
  }
  btn.addEventListener("click", function () {
    if (Progress.get(ID) === "completed") Progress.markStarted(ID);
    else Progress.markCompleted(ID);
    refresh();
  });
  refresh();
})();
</script>

<!-- ===== Pharma Hub: How to Use / SOP =================================
     A two-tab overlay (simulator instructions + instrument SOP), opened
     from the toolbar and shown automatically on a student's first visit.
     The SOP is duplicated into a hidden #sopPrintDoc so the Print button
     produces a clean sheet rather than a screenshot of the app.
     ==================================================================== -->
<div id="sopPrintDoc"></div>
<script>
(function () {
  var SEEN = "pharmahub.uvvis.guideSeen";
  var tab = "howto";

  var HOWTO = "\n<p>This is a guided simulation of instrument operation and handling. It runs through five\nstages in a fixed order, exactly as you would work at the bench.</p>\n\n<h4>The five stages</h4>\n<ol>\n  <li><strong>Instrument Introduction &amp; Power ON</strong> \u2014 learn the parts, then switch on.</li>\n  <li><strong>Setup, Blank &amp; Baseline</strong> \u2014 choose mode and wavelength, run the blank.</li>\n  <li><strong>Sample Loading &amp; Measurement</strong> \u2014 load the sample and read absorbance.</li>\n  <li><strong>Spectrum &amp; &lambda;max / Result</strong> \u2014 scan and find &lambda;<sub>max</sub>.</li>\n  <li><strong>Final Observation</strong> \u2014 review and complete your record.</li>\n</ol>\n\n<h4>Working through it</h4>\n<ul>\n  <li><strong>Stages are sequential.</strong> The next stage unlocks only once the current one\n      is done \u2014 you cannot skip ahead, just as you cannot skip steps on a real instrument.</li>\n  <li><strong>Follow the Laboratory Feedback box</strong> in the right-hand panel. It always\n      tells you the next action, and explains what went wrong if something is out of order.</li>\n  <li><strong>Watch the Observation Panel.</strong> It fills in as you work and becomes your\n      practical record. Enter your name at the top before you start.</li>\n  <li><strong>Save Observation</strong> at the bottom of each stage to lock in your readings.</li>\n  <li><strong>Progress</strong> is shown in the bar under the title.</li>\n</ul>\n\n<h4>The toolbar</h4>\n<table>\n  <tr><th>Button</th><th>What it does</th></tr>\n  <tr><td>\u2190 Library</td><td>Back to the resource library.</td></tr>\n  <tr><td>How to Use / SOP</td><td>This window. Reopen it at any time.</td></tr>\n  <tr><td>Switch Mode</td><td>Student or Instructor mode.</td></tr>\n  <tr><td>Instructor Panel</td><td>Teaching staff only \u2014 change drugs, ranges and settings.</td></tr>\n  <tr><td>Precautions</td><td>Quick laboratory safety reminders.</td></tr>\n  <tr><td>Reset Simulation</td><td>Clears everything and starts again with fresh values.</td></tr>\n  <tr><td>Mark complete</td><td>Records the session as done on your Pharma Hub progress.</td></tr>\n</table>\n\n<div class=\"tip\">Every run generates fresh values, so repeating the simulation gives a\ndifferent result each time. Practise until you can work through it without the prompts.</div>\n\n<h4>Before your practical</h4>\n<p>Read the <strong>Instrument SOP</strong> tab first. It is the procedure this simulation\nfollows, and the same one you will use on the real instrument.</p>\n";
  var SOP = "\n<h4>1. Purpose and scope</h4>\n<p>Correct operation of a double-beam UV-Visible spectrophotometer for measuring the\nabsorbance of a solution and for determining &lambda;<sub>max</sub>. Applies to routine\nqualitative and quantitative work in pharmaceutical analysis.</p>\n\n<h4>2. Preliminary checks</h4>\n<ol>\n  <li>Instrument on a level, vibration-free bench, away from direct sunlight and heat.</li>\n  <li>Mains connection secure; no cuvette left behind in the sample compartment.</li>\n  <li>Cuvettes clean, dry, unscratched, and of the correct material for the region of use.</li>\n  <li>Solvent and solutions prepared, filtered if necessary, and at room temperature.</li>\n</ol>\n\n<h4>3. Switching on and warm-up</h4>\n<ol>\n  <li>Switch on the mains, then the instrument.</li>\n  <li>Allow self-initialisation to complete \u2014 lamp check, filter and grating positioning,\n      and wavelength calibration.</li>\n  <li>Warm up for <strong>15&ndash;30 minutes</strong> (20 minutes is usual).</li>\n</ol>\n<table>\n  <tr><th>Lamp</th><th>Region covered</th><th>Used for</th></tr>\n  <tr><td>Deuterium (D<sub>2</sub>)</td><td>190&ndash;400 nm</td><td>Ultraviolet</td></tr>\n  <tr><td>Tungsten&ndash;halogen</td><td>350&ndash;1100 nm</td><td>Visible / near IR</td></tr>\n</table>\n<div class=\"caution\"><strong>Do not take readings during warm-up.</strong> The source output\nis still stabilising, so the baseline drifts and results are not reproducible.</div>\n\n<h4>4. Selecting the mode and wavelength</h4>\n<ol>\n  <li>Select the mode: photometric (fixed wavelength), spectrum scan, or quantitative.</li>\n  <li>For a known substance, set the &lambda;<sub>max</sub> given in the pharmacopoeial\n      monograph.</li>\n  <li>For an unknown, run a spectrum scan across the region and read &lambda;<sub>max</sub>\n      from the peak.</li>\n  <li>Set the scan range wide enough to contain the whole absorption band.</li>\n</ol>\n<div class=\"tip\">Measure at &lambda;<sub>max</sub> wherever possible. Sensitivity is highest\nthere, and the curve is flattest \u2014 so a small wavelength error changes the absorbance least.</div>\n\n<h4>5. Cuvette selection and handling</h4>\n<ol>\n  <li><strong>Quartz</strong> below 340 nm. Glass and disposable plastic absorb UV and may\n      only be used in the visible region.</li>\n  <li>Use a matched pair of 1.00 cm path length cells.</li>\n  <li>Hold the cuvette by its frosted or ribbed faces only \u2014 never the clear optical faces.</li>\n  <li>Rinse with a little of the solution to be measured, then fill to about three-quarters\n      (roughly 2.5&ndash;3 mL).</li>\n  <li>Wipe the optical faces with lint-free tissue and check that no air bubbles cling to\n      the walls.</li>\n  <li>Insert with the clear faces facing the light path, always in the same orientation.</li>\n</ol>\n\n<h4>6. Blank and baseline correction</h4>\n<ol>\n  <li>The blank is the <strong>same solvent used to prepare the sample</strong> \u2014 not\n      distilled water unless water is the solvent.</li>\n  <li>Double-beam: place the blank in both the reference and sample positions.\n      Single-beam: place it in the sample position.</li>\n  <li>Close the compartment lid.</li>\n  <li>Press <strong>AUTO ZERO</strong>. The display should read A = 0.000.</li>\n  <li>For a scan, run a full baseline correction across the whole wavelength range.</li>\n</ol>\n<div class=\"caution\">Blank at the same wavelength, in the same cuvette type, immediately\nbefore measuring. A blank taken under different conditions is not a valid reference.</div>\n\n<h4>7. Measuring the sample</h4>\n<ol>\n  <li>Remove the blank from the sample position and replace it with the sample cuvette in\n      the same orientation. Leave the reference cell in place.</li>\n  <li>Close the lid \u2014 measuring with it open lets stray light reach the detector.</li>\n  <li>Press <strong>START / MEASURE</strong> and read the absorbance once stable.</li>\n  <li>Take readings in triplicate and record the mean.</li>\n</ol>\n<table>\n  <tr><th>Absorbance</th><th>Interpretation</th><th>Action</th></tr>\n  <tr><td>Below 0.1</td><td>Too dilute; poor precision</td><td>Use a stronger solution</td></tr>\n  <tr><td>0.2 &ndash; 0.8</td><td>Ideal working range</td><td>Proceed</td></tr>\n  <tr><td>0.8 &ndash; 1.0</td><td>Acceptable, nearing the limit</td><td>Proceed with care</td></tr>\n  <tr><td>Above 1.0</td><td>Stray-light error; response no longer linear</td><td>Dilute and repeat</td></tr>\n</table>\n\n<h4>8. Recording results</h4>\n<ol>\n  <li>Record wavelength, absorbance, solvent, cuvette type, dilution factor, date and analyst.</li>\n  <li>Print or export the spectrum where the method requires it and attach it to the record.</li>\n  <li>Calculate concentration from the calibration curve or from A(1%, 1 cm) as the method\n      specifies.</li>\n</ol>\n\n<h4>9. Shutdown</h4>\n<ol>\n  <li>Remove both cuvettes and discard the contents as directed for that solvent.</li>\n  <li>Rinse the cuvettes with solvent, then with distilled water; dry and return them to\n      their holder.</li>\n  <li>Close the empty compartment lid, exit the software, switch off the instrument, then\n      the mains.</li>\n  <li>Complete the instrument log book with date, user, and work done.</li>\n</ol>\n\n<h4>10. Common errors and their effect</h4>\n<table>\n  <tr><th>Error</th><th>What you see</th></tr>\n  <tr><td>Fingerprints on the optical faces</td><td>High or erratic absorbance</td></tr>\n  <tr><td>Air bubbles in the light path</td><td>Unstable, jumping readings</td></tr>\n  <tr><td>Glass cuvette used below 340 nm</td><td>Falsely high absorbance; cell absorbs the UV</td></tr>\n  <tr><td>Lid left open</td><td>Low absorbance from stray light</td></tr>\n  <tr><td>Blank in a different solvent</td><td>Constant offset in every reading</td></tr>\n  <tr><td>Reading taken during warm-up</td><td>Baseline drift; poor reproducibility</td></tr>\n  <tr><td>Measuring away from &lambda;<sub>max</sub></td><td>Low sensitivity; results very sensitive to wavelength error</td></tr>\n</table>\n";

  function render() {
    var host = document.getElementById("modalHost");
    host.innerHTML =
      '<div class="modal-overlay"><div class="modal-box guide-box">' +
        '<div class="guide-head">' +
          '<h3>UV-Visible Spectrophotometer</h3>' +
          '<div class="guide-sub">Instrument operation and handling — Pharmaceutical Analysis</div>' +
          '<div class="guide-tabs">' +
            '<button class="guide-tab' + (tab === "howto" ? " on" : "") + '" ' +
              'onclick="App.guideTab(\'howto\')">How to use this simulator</button>' +
            '<button class="guide-tab' + (tab === "sop" ? " on" : "") + '" ' +
              'onclick="App.guideTab(\'sop\')">Instrument SOP</button>' +
          '</div>' +
        '</div>' +
        '<div class="guide-body" id="guideBody">' + (tab === "howto" ? HOWTO : SOP) + '</div>' +
        '<div class="guide-foot">' +
          '<span class="left">Reopen any time from <strong>How to Use / SOP</strong> in the toolbar.</span>' +
          '<span class="right">' +
            '<button class="btn btn-ghost" onclick="App.printSOP()">🖨 Print SOP</button>' +
            '<button class="btn btn-primary" onclick="App.closeModal()">Got it — begin</button>' +
          '</span>' +
        '</div>' +
      '</div></div>';
  }

  function openGuide(which) {
    tab = which || "howto";
    render();
    try { localStorage.setItem(SEEN, "1"); } catch (e) {}
  }

  function guideTab(which) {
    tab = which;
    var body = document.getElementById("guideBody");
    if (body) {
      body.innerHTML = (tab === "howto" ? HOWTO : SOP);
      body.scrollTop = 0;
      var tabs = document.querySelectorAll(".guide-tab");
      tabs[0].className = "guide-tab" + (tab === "howto" ? " on" : "");
      tabs[1].className = "guide-tab" + (tab === "sop" ? " on" : "");
    } else {
      render();
    }
  }

  function printSOP() {
    var d = new Date();
    document.getElementById("sopPrintDoc").innerHTML =
      "<h1>Standard Operating Procedure — UV-Visible Spectrophotometer</h1>" +
      '<div class="meta">Pharma Hub · Pharmaceutical Analysis · ' +
      "Printed " + d.toLocaleDateString() + "</div>" + SOP;
    window.print();
  }

  if (window.App) {
    App.openGuide = openGuide;
    App.guideTab = guideTab;
    App.printSOP = printSOP;
  }

  var seen = null;
  try { seen = localStorage.getItem(SEEN); } catch (e) {}
  if (!seen) openGuide("howto");
})();
</script>
</body>
