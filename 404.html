<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<script>
  /* ------------------------------------------------------------------
     404.html is served for URLs at any depth, so it cannot use relative
     paths. Set BASE to where the site lives:

       user/organisation site  (username.github.io)        -> "/"
       project site            (username.github.io/repo/)  -> "/repo/"
       custom domain at root   (edutechservice.in)         -> "/"
     ------------------------------------------------------------------ */
  var BASE = "/";

  document.write(
    '<link rel="stylesheet" href="' + BASE + 'style.css">'
  );
  try {
    var t = localStorage.getItem("edutech.theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>

<header id="site-header"></header>

<main>
  <section class="block">
    <div class="wrap prose">
      <h1>Page not found</h1>
      <p class="muted">
        That link does not point to anything on this site. The resource may have
        moved, or it may not be published yet.
      </p>
      <p id="fourohfour-actions"></p>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script>
  document.write(
    '<script src="' + BASE + 'site-config.js"><\/script>' +
    '<script src="' + BASE + 'resources.js"><\/script>' +
    '<script src="' + BASE + 'progress.js"><\/script>' +
    '<script src="' + BASE + 'app.js"><\/script>'
  );
</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("fourohfour-actions").innerHTML =
      '<a class="btn btn-primary" href="' + BASE + 'index.html">Go to the homepage</a> ' +
      '<a class="btn btn-ghost" href="' + BASE + 'library.html">Search the library</a>';
  });
</script>

</body>
</html>
